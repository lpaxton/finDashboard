openapi: 3.0.3
info:
  title: Advisor Platform API (dashboard domains)
  version: 0.3.0-draft
  description: |
    Draft contract for the advisor dashboard. Not built yet: this spec is the design.
    The backend service aggregates Green Meadows (custodial data) and other sources
    (calendar, CRM, task store) into these shapes, so the dashboard never talks to
    those systems directly.

    Three views, one API: firm (principal), advisor, and client portal. The caller's role decides
    what each endpoint returns. Firm-wide data is requested with scope=firm (principal role only).
    Client-portal endpoints live under /me and are limited to the signed-in client's own household.
    Internal content (prep briefs, alerts, tasks, signals, notes, sentiment, coaching) is never returned
    to a client. Anything a client sees beyond factual account data is shared explicitly by an advisor
    through POST /households/{householdId}/shares.

    Conventions
    - All calls are made by the dashboard to the backend; credentials for Green Meadows
      and other systems stay on the backend.
    - Dates are ISO 8601 (dates as YYYY-MM-DD, times in UTC with offset). The dashboard formats them.
    - Money is a number in USD.
    - Paging is zero-based with default size 20, matching Green Meadows.
    - Empty results return 200 with an empty list, not 204.
    - Every response object that summarises data carries `dataAsOf` so the UI can show freshness.
    - Account numbers are always masked (last 4 digits only).
    - Every request may send `x-trace-id`; the backend echoes it and forwards it to Green Meadows
      as x_gm_ext_traceid.
servers:
  - url: https://api.example.com/v1
    description: Placeholder. Set when the backend is deployed.
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Summary
  - name: Households
  - name: Meetings
  - name: Tasks
  - name: Alerts
  - name: Portfolio signals
  - name: Firm
  - name: Intelligence
  - name: Reporting
  - name: Playbooks
  - name: Sharing
  - name: Communications
  - name: Prospects
  - name: Onboarding
  - name: Migrations
  - name: Billing
  - name: Client portal

paths:
  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Signed-in advisor
      description: "Feeds the dashboard greeting. Requirement: IP-09."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }

  /summary:
    get:
      tags: [Summary]
      operationId: getSummary
      summary: Practice summary strip
      description: "Assets, month change, 12-month trend, counts. Assets from Green Meadows balances; counts from households, meetings and tasks. Requirement: IP-09, PO-11. Advisor role only; principals use /firm/summary for firm-wide figures."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Summary' } } } }
        '500': { $ref: '#/components/responses/Error' }

  /households:
    get:
      tags: [Households]
      operationId: listHouseholds
      summary: Book of business
      description: "Households with assets, 30-day change and last contact. Accounts and values from Green Meadows; last contact from the CRM. Requirement: PO-11, IP-09."
      parameters:
        - { $ref: '#/components/parameters/scope' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - name: sort
          in: query
          description: "Format: property,(asc|desc). Properties: name, aum, change30d, lastContactAt."
          schema: { type: string, default: 'aum,desc' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/HouseholdStatus' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdPage' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /households/{householdId}:
    get:
      tags: [Households]
      operationId: getHousehold
      summary: One household with its accounts
      description: "Requirement: IP-08, PM-01."
      parameters:
        - { $ref: '#/components/parameters/householdId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HouseholdDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /meetings:
    get:
      tags: [Meetings]
      operationId: listMeetings
      summary: Meetings in a date range
      description: "Defaults to today. Source: calendar. Requirement: MEET-01, MEET-03."
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingList' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [Meetings]
      operationId: createMeeting
      summary: Put a meeting in the calendar
      description: "Writes to the advisor's calendar. Omit householdId for a prospect meeting. Requirement: MEET-03."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeetingCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /meetings/{meetingId}:
    get:
      tags: [Meetings]
      operationId: getMeeting
      summary: One meeting with its prep brief
      description: "Requirement: MEET-01, MEET-02."
      parameters:
        - { $ref: '#/components/parameters/meetingId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Meetings]
      operationId: updateMeeting
      summary: Move or amend a meeting
      description: "Requirement: MEET-03."
      parameters:
        - { $ref: '#/components/parameters/meetingId' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeetingUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Meetings]
      operationId: cancelMeeting
      summary: Cancel a meeting
      description: "Removes it from the calendar. Requirement: MEET-03."
      parameters:
        - { $ref: '#/components/parameters/meetingId' }
      responses:
        '204': { description: Cancelled }
        '404': { $ref: '#/components/responses/Error' }

  /meetings/{meetingId}/record:
    get:
      tags: [Meetings]
      operationId: getMeetingRecord
      summary: Notes or transcript from a past meeting
      description: >
        What was captured in the meeting. A transcript is returned only when recording consent is
        on file: without it the response carries withheld=true and no content. Consent is a
        precondition for disclosure, not a label on it.
        Requirement: MEET-04, MEET-05, MEET-06.
      parameters:
        - { $ref: '#/components/parameters/meetingId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingRecord' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /meetings/{meetingId}/record/next-steps:
    post:
      tags: [Meetings]
      operationId: suggestNextSteps
      summary: Draft follow-up actions from a meeting record
      description: >
        Returns suggested actions as drafts. Nothing is created: the advisor turns a suggestion
        into a task by posting it to /tasks. Refused with 409 when the record is a transcript
        with no consent on file. Requirement: MEET-07, PL-02, X-03.
      parameters:
        - { $ref: '#/components/parameters/meetingId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NextStepDrafts' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Advisor's tasks
      description: "Requirement: PO-02, MEET-07."
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: dueBy
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaskList' } } } }
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: "Manual entry, or an accepted AI suggestion (origin meeting or alert). Requirement: PO-02, MEET-07."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /tasks/{taskId}:
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Complete, reopen or edit a task
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Items needing attention
      description: "Sorted by severity, then age. Sources include account status and margin calls (Green Meadows), compliance queue, CRM contact gaps. Requirement: PO-03, COMM-04."
      parameters:
        - { $ref: '#/components/parameters/scope' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AlertList' } } } }

  /alerts/{alertId}:
    patch:
      tags: [Alerts]
      operationId: updateAlert
      summary: Dismiss or resolve an alert
      parameters:
        - { $ref: '#/components/parameters/alertId' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /portfolio-signals:
    get:
      tags: [Portfolio signals]
      operationId: listPortfolioSignals
      summary: Portfolio signal counts
      description: "Tax loss harvesting, concentration, allocation drift, idle cash. Computed by the platform from Green Meadows positions, tax lots, balances and model portfolios. Requirement: RTI-05, PM-02."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SignalList' } } } }

  /portfolio-signals/{signalId}/items:
    get:
      tags: [Portfolio signals]
      operationId: listSignalItems
      summary: Households and accounts behind a signal
      parameters:
        - { $ref: '#/components/parameters/signalId' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SignalItemPage' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /firm/summary:
    get:
      tags: [Firm]
      operationId: getFirmSummary
      summary: Firm-wide summary
      description: "Firm assets, trend, advisor and household counts, open compliance items. Principal role only. Requirement: IP-09, PO-07, PO-10."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FirmSummary' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /firm/advisors:
    get:
      tags: [Firm]
      operationId: listAdvisors
      summary: Advisor roster with performance
      description: "Assets, households and activity per advisor. Principal role only. Requirement: PO-06, PO-07."
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - name: sort
          in: query
          description: "Properties: name, aum, households, tasksOverdue, openAlerts."
          schema: { type: string, default: 'aum,desc' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorPage' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /firm/advisors/{advisorId}:
    get:
      tags: [Firm]
      operationId: getAdvisor
      summary: One advisor, for drill-down
      description: "Lets a principal open an advisor's dashboard in read-only mode. Requirement: PO-06."
      parameters:
        - { name: advisorId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdvisorRow' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /firm/compliance:
    get:
      tags: [Firm]
      operationId: listComplianceItems
      summary: Compliance obligations across the firm
      description: "Principal role only. Requirement: PO-08."
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, overdue, done] }
        - name: advisorId
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompliancePage' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /households/{householdId}/shares:
    post:
      tags: [Sharing]
      operationId: shareWithClient
      summary: Share an approved item with the client
      description: "The only way advisor-side content reaches the client portal. The backend records who approved it and when. Requirement: X-03, RTI-08, RTI-10, AX-12."
      parameters:
        - { $ref: '#/components/parameters/householdId' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareCreate' } } }
      responses:
        '201': { description: Shared, content: { application/json: { schema: { $ref: '#/components/schemas/SharedItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /me/household:
    get:
      tags: [Client portal]
      operationId: getMyHousehold
      summary: The client's own household and accounts
      description: "Client role only. Factual account data from Green Meadows, using the client's user-specific token. Requirement: AX-12, PM-01."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClientHousehold' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /me/documents:
    get:
      tags: [Client portal]
      operationId: listMyDocuments
      summary: The client's statements and documents
      description: "Client role only. From Green Meadows document search plus advisor-shared documents. Requirement: AX-12."
      parameters:
        - { name: docType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /me/documents/{documentId}:
    get:
      tags: [Client portal]
      operationId: downloadMyDocument
      summary: Download one document
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The file, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /me/fees:
    get:
      tags: [Client portal]
      operationId: listMyFees
      summary: Fees charged and scheduled
      description: "Client role only. Requirement: AX-10."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeeList' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /me/shared:
    get:
      tags: [Client portal]
      operationId: listSharedWithMe
      summary: Items the advisor has shared
      description: "Plans, tax explanations, reports and messages the advisor approved. Requirement: RTI-08, RTI-10."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SharedItemList' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /me/preferences:
    get:
      tags: [Client portal]
      operationId: getMyPreferences
      summary: Client preferences
      description: "Backed by Green Meadows user preferences plus portal settings. Requirement: AX-12."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
    patch:
      tags: [Client portal]
      operationId: updateMyPreferences
      summary: Update client preferences
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /me/meeting-requests:
    post:
      tags: [Client portal]
      operationId: requestMeeting
      summary: Ask the advisor for a meeting
      description: "Creates a request the advisor sees as a task. Requirement: MEET-03."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeetingRequestCreate' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MeetingRequest' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /communications:
    get:
      tags: [Communications]
      operationId: listCommunications
      summary: Client messages, drafted and sent
      description: >
        AI-drafted client messages and their approval state. scope=firm gives a principal the
        review queue across every advisor. Bodies are omitted here; fetch one message for its text.
        Requirement: COMM-01, COMM-02, COMM-03.
      parameters:
        - { $ref: '#/components/parameters/scope' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CommunicationStatus' } }
        - { name: complianceReview, in: query, schema: { type: boolean }, description: Only messages flagged for compliance review. }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CommunicationPage' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /communications/{communicationId}:
    get:
      tags: [Communications]
      operationId: getCommunication
      summary: One message with its full text
      parameters:
        - { $ref: '#/components/parameters/communicationId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Communication' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Communications]
      operationId: approveCommunication
      summary: Approve, send or return a message to draft
      description: >
        The human-in-the-loop gate on anything that leaves the firm. A draft must be approved
        before it can be sent; sending an unapproved draft is refused with 409. The approver and
        the time are recorded. Requirement: COMM-01, X-03, X-05.
      parameters:
        - { $ref: '#/components/parameters/communicationId' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/CommunicationStatus' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Communication' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /prospects:
    get:
      tags: [Prospects]
      operationId: listProspects
      summary: The prospect pipeline
      description: "Stages are returned with the list so the board can render them in order. Requirement: GP-01, GP-02."
      parameters:
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/ProspectStage' } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProspectPage' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /prospects/{prospectId}:
    get:
      tags: [Prospects]
      operationId: getProspect
      summary: One prospect with intake notes
      parameters:
        - { $ref: '#/components/parameters/prospectId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Prospects]
      operationId: moveProspect
      summary: Move a prospect to another stage
      parameters:
        - { $ref: '#/components/parameters/prospectId' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [stage], properties: { stage: { $ref: '#/components/schemas/ProspectStage' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /onboarding:
    get:
      tags: [Onboarding]
      operationId: listOnboarding
      summary: Clients part-way through onboarding
      description: "Requirement: AX-01, AX-02, AX-04."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingList' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /onboarding/{onboardingId}:
    get:
      tags: [Onboarding]
      operationId: getOnboarding
      summary: One onboarding client and every step
      description: "Step detail covers intake answers, risk score, custodian application, agreements and funding. Requirement: AX-01 to AX-04."
      parameters:
        - { $ref: '#/components/parameters/onboardingId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Onboarding' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /onboarding/{onboardingId}/steps/{stepId}:
    patch:
      tags: [Onboarding]
      operationId: updateOnboardingStep
      summary: Mark an onboarding step complete or open
      parameters:
        - { $ref: '#/components/parameters/onboardingId' }
        - { name: stepId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/OnboardingStepStatus' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Onboarding' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /onboarding/{onboardingId}/convert:
    post:
      tags: [Onboarding]
      operationId: convertOnboarding
      summary: Turn a completed onboarding into a household
      description: >
        Refused with 409 until every step is done, and refused again if already converted.
        Creates the household and returns its id. Requirement: AX-02, AX-04.
      parameters:
        - { $ref: '#/components/parameters/onboardingId' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ConversionResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /migrations:
    get:
      tags: [Migrations]
      operationId: listMigrations
      summary: Past book imports
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationList' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Migrations]
      operationId: createMigration
      summary: Import a book of business
      description: >
        Validates each row, imports the ones that pass, and returns the invalid rows with their
        problems rather than failing the whole import. Imported households are marked
        needs_review: nothing arrives trusted. Not one of the 75 requirements; a firm cannot move
        onto the platform without it. A real implementation is asynchronous.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MigrationRequest' } } }
      responses:
        '201': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/Migration' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /households/{householdId}/allocation:
    get:
      tags: [Households]
      operationId: getHouseholdAllocation
      summary: Allocation against the household's model
      description: >
        Target and current weights per asset class, with the drift between them. model is null
        when no model is on file. maxDriftPoints matches the allocation_drift portfolio signal.
        Requirement: PM-02, PM-03.
      parameters:
        - { $ref: '#/components/parameters/householdId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Allocation' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /billing/fees:
    get:
      tags: [Billing]
      operationId: listClientFees
      summary: What the firm charges its clients
      description: >
        The tiered fee schedule and the fee each household attracts under it. The same schedule
        produces the figures a client sees at /me/fees. Requirement: AX-10, AX-11.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClientFees' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /firm/billing/subscription:
    get:
      tags: [Firm]
      operationId: getSubscription
      summary: What the firm pays for the platform
      description: >
        Seats, usage against plan, and the current invoice. Principal only: this is the firm's
        own commercial relationship, not an advisor's. The payment method is masked to the last
        four digits, like every other account number in this API. Requirement: PO-10.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /firm/billing/invoices:
    get:
      tags: [Firm]
      operationId: listInvoices
      summary: Platform invoice history
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePage' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /firm/billing/invoices/{invoiceId}:
    get:
      tags: [Firm]
      operationId: getInvoice
      summary: One invoice, broken down
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /firm/branding:
    get:
      tags: [Firm]
      operationId: getBranding
      summary: Firm identity used across every view
      description: >
        Readable by anyone signed in, because the client portal carries the firm's branding too.
        It holds no client data. Requirement: GP-07, GP-10.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
    patch:
      tags: [Firm]
      operationId: updateBranding
      summary: Change the firm's branding
      description: "Principal only. The change is attributed and timestamped. Requirement: GP-07, GP-10, X-05."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BrandingUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Branding' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /queries:
    get:
      tags: [Intelligence]
      operationId: listQueries
      summary: Questions this user has asked
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/size' }
        - { $ref: '#/components/parameters/sort' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QueryPage' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Intelligence]
      operationId: ask
      summary: Ask a question of the connected sources
      description: >
        The query surface behind IP-01 to IP-08 and IP-11. Scoped like every other operation:
        own is the caller's book, firm needs the principal role, household is one household the
        caller may already see.

        Three properties this contract commits to. Citations are part of the answer, not a
        footnote, and carry a source and a data-as-of date (X-04). `unanswerable` names the
        sources that could not contribute and why, because most sources are not connected yet
        and a confident answer with no source is the failure that ends pilots. And a query only
        reads: anything actionable comes back in `actions` as a draft the advisor accepts, the
        same shape as suggested next steps (X-03).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QueryRequest' } } }
      responses:
        '201': { description: Answered, content: { application/json: { schema: { $ref: '#/components/schemas/Query' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /queries/{queryId}:
    get:
      tags: [Intelligence]
      operationId: getQuery
      summary: One answered question
      description: Also the poll target for a question that takes long enough to answer asynchronously.
      parameters:
        - { name: queryId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Query' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /reports/practice:
    get:
      tags: [Reporting]
      operationId: getPracticeReport
      summary: Practice numbers for a period, against the period before it
      description: >
        Counts only what the platform can evidence. Every metric carries the previous period's
        value and the change, and `lowerIsBetter` so a rise in overdue work is not coloured as
        progress. scope=firm requires the principal role. Requirement PO-07.
      parameters:
        - { $ref: '#/components/parameters/scope' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeReport' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /firm/advisors/{advisorId}/scorecard:
    get:
      tags: [Firm]
      operationId: getAdvisorScorecard
      summary: One advisor against the firm
      description: >
        An advisor may read their own; a principal may read anyone's. Only a principal sees
        `rank`, because placing someone against named peers is a management decision rather
        than a reporting one. This resolves the open question in HANDOFF section 9 about who
        sees performance tracking. Requirement AX-08, PO-06.
      parameters:
        - { $ref: '#/components/parameters/advisorId' }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Scorecard' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /next-actions:
    get:
      tags: [Reporting]
      operationId: listNextActions
      summary: What to do next, across the book
      description: >
        One prioritised list drawn from alerts, contact gaps, drafts awaiting approval, tax
        signals, unprepared meetings and onboarding in progress. Every item is a draft with its
        reason and its sources; `suggestedTask` is what an advisor posts to /tasks to accept
        one. Nothing here is created (X-03). Requirement PL-02.
      parameters:
        - { $ref: '#/components/parameters/scope' }
        - { $ref: '#/components/parameters/size' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NextActionList' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /firm/cap-table:
    get:
      tags: [Firm]
      operationId: getCapTable
      summary: Who owns the firm
      description: >
        The firm's own ownership, not a client's. Principal only: this is the most sensitive
        non-client data the platform holds. Requirement PO-12.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CapTable' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /team-shares:
    get:
      tags: [Sharing]
      operationId: listTeamShares
      summary: Households shared with you, and by you
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamShareList' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Sharing]
      operationId: shareWithColleague
      summary: Give a colleague read access to one household
      description: >
        Widens who may see a household, so it is recorded and revocable rather than implicit.
        Read access only; the owning advisor stays the owner. Requirement PO-04.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamShareCreate' } } }
      responses:
        '201': { description: Shared, content: { application/json: { schema: { $ref: '#/components/schemas/TeamShare' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /team-shares/{teamShareId}:
    delete:
      tags: [Sharing]
      operationId: revokeTeamShare
      summary: End a team share
      description: Either side may end it, and the revocation is recorded.
      parameters:
        - { name: teamShareId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }

  /billing/fee-plan:
    get:
      tags: [Billing]
      operationId: getFeePlan
      summary: The fee schedule and any per-household overrides
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeePlan' } } } }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Billing]
      operationId: updateFeePlan
      summary: Change the firm's fee schedule
      description: >
        Principal only: the schedule is the firm's, and an advisor changes one client's rate
        rather than everyone's. Tiers must start at zero, meet exactly with no gap or overlap,
        and end open-ended, so no household can fall through without a rate. The change is
        attributed. Requirement AX-11, X-05.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [schedule], properties: { schedule: { type: array, items: { $ref: '#/components/schemas/FeeTier' } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeePlan' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /billing/fees/{householdId}:
    patch:
      tags: [Billing]
      operationId: setHouseholdFee
      summary: Override one household's rate
      description: >
        An advisor may set a rate for their own household that differs from the schedule. A
        reason is required, because the change alters what a client is billed and the record
        has to say why. Send annualRatePct null to remove the override. Requirement AX-11.
      parameters:
        - { $ref: '#/components/parameters/householdId' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeeOverrideUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeeOverride' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /models:
    get:
      tags: [Households]
      operationId: listModels
      summary: Model portfolios available to compare against
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModelList' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /households/{householdId}/model-comparison:
    post:
      tags: [Households]
      operationId: compareToModel
      summary: What would change if this household moved to another model
      description: >
        Per asset class, the current weight against the proposed one, the change in points and
        in dollars, and the resulting turnover. A comparison, not an instruction: `placed` is
        always false and no trade can be sent from here. Placing a trade is PM-05, which is on
        the regulatory review list. Requirement PM-03.
      parameters:
        - { $ref: '#/components/parameters/householdId' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [modelId], properties: { modelId: { type: string } } } } }
      responses:
        '201': { description: Compared, content: { application/json: { schema: { $ref: '#/components/schemas/ModelComparison' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /playbooks:
    get:
      tags: [Playbooks]
      operationId: listPlaybooks
      summary: Reusable sequences of follow-ups
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybookList' } } } }
        '403': { $ref: '#/components/responses/Error' }

  /playbooks/{playbookId}/runs:
    post:
      tags: [Playbooks]
      operationId: runPlaybook
      summary: Run a playbook and create its follow-ups
      description: >
        Unlike a suggestion, running a playbook is itself the advisor's explicit action, so the
        follow-ups are created rather than drafted. Each step's due date is its offset from the
        anchor date. Requirement AX-09.
      parameters:
        - { name: playbookId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlaybookRunRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybookRun' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /prospects/{prospectId}/matches:
    get:
      tags: [Prospects]
      operationId: matchProspect
      summary: Which advisor fits this prospect
      description: >
        Ranked by how close the prospect's assets are to each advisor's typical client and how
        much capacity they have, with the reasoning stated. A suggestion: reassigning is a human
        decision and nothing here moves the prospect. Requirement GP-01.
      parameters:
        - { $ref: '#/components/parameters/prospectId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MatchList' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token for the platform backend. Green Meadows credentials are never exposed here.

  parameters:
    scope:
      name: scope
      in: query
      description: "own (default) returns the caller's clients. firm returns firm-wide data and requires the principal role."
      schema: { type: string, enum: [own, firm], default: own }
    page: { name: page, in: query, description: Zero-based page index, schema: { type: integer, minimum: 0, default: 0 } }
    size: { name: size, in: query, description: Page size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    householdId: { name: householdId, in: path, required: true, schema: { type: string } }
    meetingId: { name: meetingId, in: path, required: true, schema: { type: string } }
    taskId: { name: taskId, in: path, required: true, schema: { type: string } }
    alertId: { name: alertId, in: path, required: true, schema: { type: string } }
    signalId: { name: signalId, in: path, required: true, schema: { type: string } }
    communicationId: { name: communicationId, in: path, required: true, schema: { type: string } }
    prospectId: { name: prospectId, in: path, required: true, schema: { type: string } }
    onboardingId: { name: onboardingId, in: path, required: true, schema: { type: string } }
    sort:
      name: sort
      in: query
      description: "field,direction. Direction is asc or desc; each operation documents its default."
      schema: { type: string, example: 'createdAt,desc' }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
        traceId: { type: string }

    Source:
      type: string
      description: Where the data came from, so the UI can show freshness and provenance.
      enum: [greenmeadows, crm, calendar, platform]

    Session:
      type: object
      required: [id, name, role, roles, views, firm]
      properties:
        id: { type: string }
        name: { type: string, example: Dana Whitfield }
        role: { type: string, description: Job title for display, example: Senior advisor }
        roles:
          type: array
          description: Permission roles. A solo advisor may hold both principal and advisor.
          items: { type: string, enum: [principal, advisor, associate, client] }
        views:
          type: array
          description: Views this user may open, in default order.
          items: { type: string, enum: [firm, advisor, client] }
        firm:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }

    AumBlock:
      type: object
      description: Assets under management with its month change and 12-month history.
      required: [value, changeMtd, trend]
      properties:
        value: { type: number, example: 412600000 }
        changeMtd: { type: number, description: "Fraction, 0.018 = 1.8%", example: 0.018 }
        trend:
          type: array
          description: Last 12 month-end values, oldest first.
          items: { $ref: '#/components/schemas/TrendPoint' }

    Summary:
      type: object
      required: [aum, households, meetingsThisWeek, tasksOpen, tasksDueToday, dataAsOf]
      properties:
        aum: { $ref: '#/components/schemas/AumBlock' }
        households: { type: integer }
        meetingsThisWeek: { type: integer }
        tasksOpen: { type: integer }
        tasksDueToday: { type: integer }
        dataAsOf: { type: string, format: date-time }

    HouseholdStatus:
      type: string
      enum: [on_track, needs_review, overdue_contact, onboarding, forms_incomplete]

    HouseholdSummary:
      type: object
      required: [id, name, aum, change30d, status]
      properties:
        id: { type: string }
        name: { type: string }
        aum: { type: number }
        change30d: { type: number, description: Fraction, example: 0.012 }
        lastContactAt: { type: string, format: date-time, nullable: true, description: From the CRM. Null when unknown. }
        status: { $ref: '#/components/schemas/HouseholdStatus' }
        accountCount: { type: integer }
        dataAsOf: { type: string, format: date-time }

    HouseholdPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HouseholdSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    AccountSummary:
      type: object
      required: [maskedNumber, type, status, balance]
      properties:
        maskedNumber: { type: string, example: '****4821' }
        type: { type: string, example: Individual brokerage }
        status: { type: string, description: From Green Meadows account status, example: active }
        openingStatus: { type: string, enum: [igo, igox, nigo] }
        balance: { type: number }
        todayGainLoss: { type: number }
        totalGainLoss: { type: number }

    HouseholdDetail:
      allOf:
        - $ref: '#/components/schemas/HouseholdSummary'
        - type: object
          properties:
            accounts: { type: array, items: { $ref: '#/components/schemas/AccountSummary' } }

    PrepStatus:
      type: string
      enum: [ready, needs_prep]

    Meeting:
      type: object
      required: [id, startsAt, householdId, householdName, type, prepStatus]
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        durationMinutes: { type: integer }
        householdId: { type: string }
        householdName: { type: string }
        type: { type: string, example: Annual review }
        prepStatus: { $ref: '#/components/schemas/PrepStatus' }
        brief: { type: string, nullable: true, description: AI-drafted prep brief. Draft until the advisor accepts it. }
        briefSources:
          type: array
          description: Systems the brief drew from, for citation.
          items: { $ref: '#/components/schemas/Source' }

    MeetingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Meeting' } }

    TaskStatus:
      type: string
      enum: [open, done]

    TaskOrigin:
      type: string
      enum: [manual, meeting, alert]

    Task:
      type: object
      required: [id, title, status, origin]
      properties:
        id: { type: string }
        title: { type: string }
        householdId: { type: string, nullable: true }
        householdName: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
        origin: { $ref: '#/components/schemas/TaskOrigin' }
        originMeetingId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sync: { $ref: '#/components/schemas/SyncState' }

    TaskCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        householdId: { type: string }
        dueDate: { type: string, format: date }
        origin: { $ref: '#/components/schemas/TaskOrigin' }
        originMeetingId: { type: string }

    TaskUpdate:
      type: object
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }

    TaskList:
      type: object
      required: [items, openCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        openCount: { type: integer }

    Severity:
      type: string
      enum: [high, medium, low]

    AlertStatus:
      type: string
      enum: [open, dismissed, resolved]

    AlertAction:
      type: object
      required: [type, label]
      properties:
        type: { type: string, enum: [review, open_queue, draft_email, send_reminder] }
        label: { type: string, example: Review }
        targetId: { type: string, description: 'Household, queue or item the action opens.' }

    Alert:
      type: object
      required: [id, severity, title, status, createdAt]
      properties:
        id: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        householdId: { type: string, nullable: true }
        householdName: { type: string, nullable: true, description: Null for practice-level alerts. }
        source: { $ref: '#/components/schemas/Source' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        action: { $ref: '#/components/schemas/AlertAction' }
        createdAt: { type: string, format: date-time }

    AlertUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AlertStatus' }

    AlertList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }

    SignalKind:
      type: string
      enum: [tax_loss_harvesting, concentration, allocation_drift, idle_cash]

    Signal:
      type: object
      required: [id, kind, count, label]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/SignalKind' }
        count: { type: integer }
        label: { type: string }
        detail: { type: string, example: 'About $61,200 in unrealized losses' }
        dataAsOf: { type: string, format: date-time }

    SignalList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Signal' } }

    SignalItem:
      type: object
      required: [householdId, householdName, maskedAccountNumber, detail]
      properties:
        householdId: { type: string }
        householdName: { type: string }
        maskedAccountNumber: { type: string }
        detail: { type: string, example: 24% of equities in one holding }
        amount: { type: number, nullable: true }

    SignalItemPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SignalItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    FirmSummary:
      type: object
      required: [aum, advisors, households, openComplianceItems, dataAsOf]
      properties:
        aum: { $ref: '#/components/schemas/AumBlock' }
        advisors: { type: integer }
        households: { type: integer }
        openComplianceItems: { type: integer }
        overdueComplianceItems: { type: integer }
        dataAsOf: { type: string, format: date-time }

    AdvisorRow:
      type: object
      required: [id, name, households, aum]
      properties:
        id: { type: string }
        name: { type: string }
        households: { type: integer }
        aum: { type: number }
        change30d: { type: number, description: Fraction }
        meetingsThisWeek: { type: integer }
        tasksOverdue: { type: integer }
        openAlerts: { type: integer }
        dataAsOf: { type: string, format: date-time }

    AdvisorPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdvisorRow' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    ComplianceItem:
      type: object
      required: [id, title, category, status]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string, enum: [communications_review, annual_review, disclosure, restriction, agreement] }
        advisorId: { type: string }
        advisorName: { type: string }
        householdId: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [open, overdue, done] }

    CompliancePage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceItem' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    ShareType:
      type: string
      enum: [plan, tax_explanation, report, proposal, message, document]

    ShareCreate:
      type: object
      required: [type, sourceId, title]
      properties:
        type: { $ref: '#/components/schemas/ShareType' }
        sourceId: { type: string, description: The advisor-side item being shared. }
        title: { type: string }
        message: { type: string, description: Optional note shown to the client. }

    SharedItem:
      type: object
      required: [id, type, title, sharedAt, sharedBy]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ShareType' }
        title: { type: string }
        message: { type: string, nullable: true }
        sharedAt: { type: string, format: date-time }
        sharedBy: { type: string, description: Advisor who approved the share. }
        contentUrl: { type: string, nullable: true }

    SharedItemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SharedItem' } }

    ClientAccount:
      type: object
      description: Client-safe account view. No opening or maintenance status.
      required: [maskedNumber, type, balance]
      properties:
        maskedNumber: { type: string, example: '****4821' }
        type: { type: string }
        balance: { type: number }
        todayGainLoss: { type: number }
        totalGainLoss: { type: number }

    TrendPoint:
      type: object
      required: [month, value]
      properties:
        month: { type: string, example: '2026-09' }
        value: { type: number }

    ClientHousehold:
      type: object
      required: [id, name, aum, accounts, dataAsOf]
      properties:
        id: { type: string }
        name: { type: string }
        aum: { type: number }
        change30d: { type: number, description: Fraction }
        trend:
          type: array
          description: >
            Last 12 month-end values of the household, oldest first, for the portal's value chart.
            Must come from custodial balance history. The dashboard draws no chart when this is
            absent: it must never synthesise a performance line the firm cannot evidence.
          items: { $ref: '#/components/schemas/TrendPoint' }
        advisorName: { type: string }
        accounts: { type: array, items: { $ref: '#/components/schemas/ClientAccount' } }
        dataAsOf: { type: string, format: date-time }

    Document:
      type: object
      required: [id, title, docType, date]
      properties:
        id: { type: string }
        title: { type: string }
        docType: { type: string }
        maskedAccountNumber: { type: string, nullable: true }
        date: { type: string, format: date }
        source: { $ref: '#/components/schemas/Source' }

    DocumentPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Document' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    Fee:
      type: object
      required: [id, description, amount, status]
      properties:
        id: { type: string }
        maskedAccountNumber: { type: string }
        description: { type: string }
        amount: { type: number }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        status: { type: string, enum: [scheduled, billed, paid, waived] }

    FeeList:
      type: object
      required: [items, dataAsOf]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Fee' } }
        dataAsOf: { type: string, format: date-time }

    Preferences:
      type: object
      description: Draft. Fields to be matched to the Green Meadows preferences endpoints once their shapes are known.
      properties:
        paperless: { type: boolean }
        notificationChannels:
          type: array
          items: { type: string, enum: [email, sms, portal] }

    MeetingRequestCreate:
      type: object
      required: [topic]
      properties:
        topic: { type: string }
        preferredTimes: { type: array, items: { type: string, format: date-time } }
        note: { type: string }

    MeetingRequest:
      type: object
      required: [id, status, topic, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [requested, confirmed, declined] }
        topic: { type: string }
        createdAt: { type: string, format: date-time }

    # ---- Client engagement, growth and practice operations ----

    CommunicationStatus:
      type: string
      description: >
        draft is AI output awaiting a human. approved means an advisor has accepted it but it has
        not gone out. sent means it has left the firm. A draft cannot go straight to sent.
      enum: [draft, approved, sent]

    CommunicationSummary:
      type: object
      required: [id, householdId, subject, status, channel, createdAt]
      properties:
        id: { type: string }
        householdId: { type: string, nullable: true }
        householdName: { type: string, nullable: true }
        advisorName: { type: string }
        subject: { type: string }
        channel: { type: string, enum: [email, letter, portal] }
        status: { $ref: '#/components/schemas/CommunicationStatus' }
        tone: { type: string, description: The tone the draft was written in. Requirement COMM-02. }
        draftedBy: { type: string, enum: [ai, advisor] }
        complianceReview: { type: boolean, description: Flagged for compliance review before it may be sent. }
        source: { $ref: '#/components/schemas/Source' }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        sync: { $ref: '#/components/schemas/SyncState' }

    Communication:
      allOf:
        - $ref: '#/components/schemas/CommunicationSummary'
        - type: object
          required: [body]
          properties:
            body: { type: string, description: The full message text. }

    CommunicationPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CommunicationSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    ProspectStage:
      type: string
      enum: [lead, contacted, meeting_scheduled, proposal, onboarding, converted]

    ProspectSummary:
      type: object
      required: [id, name, stage, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        stage: { $ref: '#/components/schemas/ProspectStage' }
        estimatedAssets: { type: number, nullable: true }
        source: { type: string, enum: [referral, website, event, other] }
        meetingId: { type: string, nullable: true, description: 'The meeting this prospect is booked into, if any.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sync: { $ref: '#/components/schemas/SyncState' }

    Prospect:
      allOf:
        - $ref: '#/components/schemas/ProspectSummary'
        - type: object
          properties:
            intakeNotes: { type: string, nullable: true }

    ProspectPage:
      type: object
      required: [items, stages, page, size, totalItems]
      properties:
        stages:
          type: array
          description: Every stage in board order, so the UI does not hardcode them.
          items: { $ref: '#/components/schemas/ProspectStage' }
        items: { type: array, items: { $ref: '#/components/schemas/ProspectSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    OnboardingStepStatus:
      type: string
      enum: [not_started, open, done]

    OnboardingStep:
      type: object
      required: [id, label, status]
      properties:
        id: { type: string, example: custodian_application }
        label: { type: string, example: Custodian application }
        status: { $ref: '#/components/schemas/OnboardingStepStatus' }
        detail: { type: string, nullable: true, description: What was captured at this step. Null when not started. }
        completedAt: { type: string, format: date-time, nullable: true }

    Onboarding:
      type: object
      required: [id, name, startedAt, steps, stepsComplete, stepsTotal, readyToConvert]
      properties:
        id: { type: string }
        name: { type: string }
        startedAt: { type: string, format: date-time }
        convertedAt: { type: string, format: date-time, nullable: true }
        stepsComplete: { type: integer }
        stepsTotal: { type: integer }
        readyToConvert: { type: boolean, description: Every step done and not yet converted. }
        steps: { type: array, items: { $ref: '#/components/schemas/OnboardingStep' } }

    OnboardingList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Onboarding' } }

    ConversionResult:
      type: object
      required: [onboardingId, householdId, name, convertedAt]
      properties:
        onboardingId: { type: string }
        householdId: { type: string }
        name: { type: string }
        convertedAt: { type: string, format: date-time }

    MigrationRequest:
      type: object
      required: [source, rows]
      properties:
        source: { type: string, description: 'Where the book is coming from, for the audit trail.', example: Redtail export }
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              aum: { type: number, minimum: 0 }

    Migration:
      type: object
      required: [id, source, status, counts, createdAt]
      properties:
        id: { type: string }
        source: { type: string }
        status: { type: string, enum: [validating, imported, failed] }
        counts:
          type: object
          required: [read, valid, invalid, imported]
          properties:
            read: { type: integer }
            valid: { type: integer }
            invalid: { type: integer }
            imported: { type: integer }
        invalidRows:
          type: array
          description: Rows that failed validation, with the reason. The import continues without them.
          items:
            type: object
            properties:
              row: { type: integer, description: Zero-based index in the submitted rows. }
              problems: { type: array, items: { type: string } }
        createdHouseholdIds: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    MigrationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Migration' } }

    MeetingCreate:
      type: object
      required: [startsAt, type]
      properties:
        startsAt: { type: string, format: date-time }
        type: { type: string, example: Annual review }
        householdId: { type: string, nullable: true, description: Omit for a prospect meeting. }
        durationMinutes: { type: integer, default: 30 }
        brief: { type: string, nullable: true }

    MeetingUpdate:
      type: object
      properties:
        startsAt: { type: string, format: date-time }
        type: { type: string }
        durationMinutes: { type: integer }
        prepStatus: { type: string, enum: [ready, needs_prep] }
        brief: { type: string, nullable: true }

    RecordingConsent:
      type: object
      description: >
        Consent to record, as captured at the meeting. Requirement MEET-04, which is flagged for
        compliance and legal review before build.
      required: [obtained]
      properties:
        obtained: { type: boolean }
        obtainedAt: { type: string, format: date-time, nullable: true }
        method: { type: string, nullable: true, example: 'verbal, recorded' }

    MeetingRecord:
      type: object
      required: [meetingId, kind, withheld]
      properties:
        meetingId: { type: string }
        kind: { type: string, enum: [notes, transcript] }
        author: { type: string, description: Who or what captured it. }
        capturedAt: { type: string, format: date-time }
        consent: { $ref: '#/components/schemas/RecordingConsent' }
        withheld: { type: boolean, description: True when consent is not on file for a transcript. }
        withheldReason: { type: string, nullable: true }
        content: { type: string, nullable: true, description: Null when withheld. }
        source: { $ref: '#/components/schemas/Source' }
        sync: { $ref: '#/components/schemas/SyncState' }

    NextStepDrafts:
      type: object
      required: [meetingId, items, generatedAt, accepted]
      properties:
        meetingId: { type: string }
        generatedAt: { type: string, format: date-time }
        model: { type: string, description: 'Which model produced the suggestions, for the audit trail.' }
        accepted:
          type: boolean
          description: >
            Always false. Suggestions are drafts; they become tasks only when the advisor posts
            them to /tasks. Requirement X-03.
        items:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              dueDate: { type: string, format: date, nullable: true }
              householdId: { type: string, nullable: true }

    AllocationLine:
      type: object
      required: [assetClass, targetPct, currentPct, driftPct]
      properties:
        assetClass: { type: string, example: US equity }
        targetPct: { type: number, description: 'Percentage points, not a fraction.' }
        currentPct: { type: number }
        driftPct: { type: number, description: 'current minus target, in percentage points.' }

    Allocation:
      type: object
      required: [householdId, lines, dataAsOf]
      properties:
        householdId: { type: string }
        householdName: { type: string }
        model:
          type: object
          nullable: true
          description: Null when the household has no model on file; lines is then empty.
          properties:
            id: { type: string }
            name: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/AllocationLine' } }
        maxDriftPoints:
          type: number
          nullable: true
          description: Largest absolute drift. Matches the allocation_drift portfolio signal for this household.
        source: { $ref: '#/components/schemas/Source' }
        dataAsOf: { type: string, format: date-time }

    FeeTier:
      type: object
      required: [minAssets, annualRatePct]
      properties:
        minAssets: { type: number }
        maxAssets: { type: number, nullable: true, description: Null on the top tier. }
        annualRatePct: { type: number, example: 0.85 }

    ClientFees:
      type: object
      required: [schedule, items, nextRunDate, dataAsOf]
      properties:
        schedule: { type: array, items: { $ref: '#/components/schemas/FeeTier' } }
        nextRunDate: { type: string, format: date }
        currency: { type: string, example: USD }
        totalQuarterlyFees: { type: number }
        items:
          type: array
          items:
            type: object
            required: [householdId, billableAssets, annualRatePct, quarterlyFee]
            properties:
              householdId: { type: string }
              householdName: { type: string }
              billableAssets: { type: number }
              annualRatePct: { type: number }
              quarterlyFee: { type: number }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        dataAsOf: { type: string, format: date-time }

    UsageMeter:
      type: object
      required: [id, label, used, included, unit]
      properties:
        id: { type: string }
        label: { type: string }
        used: { type: number }
        included: { type: number }
        unit: { type: string }

    Subscription:
      type: object
      required: [plan, seats, meters, renewalDate, dataAsOf]
      properties:
        plan: { type: string }
        seats:
          type: object
          required: [purchased, used]
          properties:
            purchased: { type: integer }
            used: { type: integer }
        meters: { type: array, items: { $ref: '#/components/schemas/UsageMeter' } }
        renewalDate: { type: string, format: date }
        billingContact: { type: string }
        paymentMethod:
          type: object
          description: Masked. A backend must never hold or return a full card number.
          properties:
            brand: { type: string, example: Visa }
            maskedNumber: { type: string, example: '****4242' }
            expiryMonth: { type: integer }
            expiryYear: { type: integer }
        currentInvoice: { $ref: '#/components/schemas/InvoiceSummary' }
        dataAsOf: { type: string, format: date-time }

    InvoiceSummary:
      type: object
      required: [id, number, amount, status]
      properties:
        id: { type: string }
        number: { type: string, example: MW-202609 }
        periodMonth: { type: string, example: '2026-09' }
        amount: { type: number }
        status: { type: string, enum: [due, paid, overdue] }
        issuedDate: { type: string, format: date }
        dueDate: { type: string, format: date }

    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceSummary'
        - type: object
          properties:
            lines:
              type: array
              items:
                type: object
                properties:
                  description: { type: string }
                  quantity: { type: number }
                  unitAmount: { type: number }
                  amount: { type: number }

    InvoicePage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    BrandingUpdate:
      type: object
      properties:
        firmName: { type: string }
        advisorDisplayName: { type: string }
        markLetter: { type: string, minLength: 1, maxLength: 1 }
        accentColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#0E5A57' }

    Branding:
      allOf:
        - $ref: '#/components/schemas/BrandingUpdate'
        - type: object
          required: [firmId, updatedAt]
          properties:
            firmId: { type: string }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string }

    QueryRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, example: 'Which clients are holding cash above target?' }
        scope:
          type: string
          enum: [own, firm, household]
          default: own
          description: 'firm requires the principal role. household requires a household the caller may see.'
        householdId: { type: string, nullable: true, description: 'Required when scope is household.' }

    SyncState:
      type: object
      description: >
        Whether this record has reached the firm's CRM, which is the system of record.
        The platform is a working surface: it owns the AI drafts, the approvals and the capture,
        and writes the result back. See docs/system-of-record.md.

        not_configured is a supported state, not a failure. When no CRM is connected the record
        says so rather than implying a sync happened, in the same way a query names the sources
        it could not reach.
      required: [status]
      properties:
        status:
          type: string
          enum: [not_configured, pending, synced, failed, conflict]
          description: >
            not_configured, no CRM is connected. pending, accepted here and not yet written.
            synced, the CRM agrees. failed, the write was rejected. conflict, both sides changed
            since the last sync and nothing resolves that yet.
        system: { type: string, nullable: true, enum: [salesforce, wealthbox, redtail, null] }
        externalId: { type: string, nullable: true, description: 'The record in the CRM.' }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true, description: 'Why the last write was rejected.' }

    Citation:
      type: object
      description: Where one part of the answer came from. Required by X-04.
      required: [source, dataAsOf]
      properties:
        source: { $ref: '#/components/schemas/Source' }
        id: { type: string, description: 'The record in that source.' }
        label: { type: string, description: 'What to show a human.' }
        dataAsOf: { type: string, format: date-time }

    UnansweredSource:
      type: object
      description: >
        A source the question needed that could not contribute. Present so a partial answer can
        say what it could not see, rather than implying it saw everything.
      required: [source, reason]
      properties:
        source: { type: string, example: crm }
        reason: { type: string, example: 'No CRM is connected.' }

    Query:
      type: object
      required: [id, question, scope, answer, citations, unanswerable, dataAsOf, createdAt]
      properties:
        id: { type: string }
        question: { type: string }
        scope: { type: string, enum: [own, firm, household] }
        householdId: { type: string, nullable: true }
        answer: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        unanswerable: { type: array, items: { $ref: '#/components/schemas/UnansweredSource' } }
        actions:
          type: array
          description: >
            Drafts only. A query never changes anything; an advisor turns a draft into a task
            by posting it to /tasks, exactly as with suggested next steps.
          items:
            type: object
            properties:
              title: { type: string }
              householdId: { type: string, nullable: true }
        model: { type: string, description: 'What produced the answer, for the audit trail.' }
        askedBy: { type: string }
        dataAsOf: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    QueryPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Query' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }

    ReportMetric:
      type: object
      required: [id, label, value, unit]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string, enum: [count, usd] }
        value: { type: number }
        previousValue: { type: number }
        change: { type: number, description: 'value minus previousValue.' }
        lowerIsBetter: { type: boolean, description: 'True for overdue work, so a rise is not progress.' }

    PracticeReport:
      type: object
      required: [scope, from, to, metrics, dataAsOf]
      properties:
        scope: { type: string, enum: [own, firm] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        previousFrom: { type: string, format: date }
        previousTo: { type: string, format: date }
        metrics: { type: array, items: { $ref: '#/components/schemas/ReportMetric' } }
        breakdowns:
          type: object
          properties:
            meetingsByType: { type: array, items: { $ref: '#/components/schemas/LabelCount' } }
            communicationsByStatus: { type: array, items: { $ref: '#/components/schemas/LabelCount' } }
            complianceByStatus: { type: array, items: { $ref: '#/components/schemas/LabelCount' } }
        dataAsOf: { type: string, format: date-time }

    LabelCount:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }

    ScorecardMetric:
      type: object
      required: [id, label, value, firmMedian]
      properties:
        id: { type: string }
        label: { type: string }
        unit: { type: string, enum: [count, usd] }
        value: { type: number }
        firmMedian: { type: number }
        lowerIsBetter: { type: boolean }
        rank: { type: integer, description: 'Principal only. Absent for an advisor reading their own.' }
        outOf: { type: integer }

    Scorecard:
      type: object
      required: [advisorId, advisorName, metrics, dataAsOf]
      properties:
        advisorId: { type: string }
        advisorName: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        metrics: { type: array, items: { $ref: '#/components/schemas/ScorecardMetric' } }
        dataAsOf: { type: string, format: date-time }

    NextAction:
      type: object
      required: [id, priority, kind, title, reason, citations, suggestedTask]
      properties:
        id: { type: string }
        priority: { type: string, enum: [high, medium, low] }
        kind: { type: string, enum: [alert, contact, approval, tax, prep, onboarding] }
        title: { type: string }
        reason: { type: string, description: 'Why this is being suggested, in the advisor''s terms.' }
        householdId: { type: string, nullable: true }
        householdName: { type: string, nullable: true }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        suggestedTask:
          type: object
          description: 'A draft. Post it to /tasks to accept it; nothing is created here.'
          properties:
            title: { type: string }
            dueDate: { type: string, format: date }
            householdId: { type: string, nullable: true }

    NextActionList:
      type: object
      required: [items, totalItems, dataAsOf]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NextAction' } }
        totalItems: { type: integer }
        note: { type: string }
        dataAsOf: { type: string, format: date-time }

    CapTableHolder:
      type: object
      required: [id, holder, shareClass, shares, ownershipPct]
      properties:
        id: { type: string }
        holder: { type: string }
        role: { type: string }
        shareClass: { type: string }
        shares: { type: number }
        vested: { type: number }
        unvested: { type: number }
        vestingEndsOn: { type: string, format: date, nullable: true }
        ownershipPct: { type: number }
        fullyDilutedPct: { type: number }

    CapTable:
      type: object
      required: [asOf, totalShares, holders, dataAsOf]
      properties:
        asOf: { type: string, format: date }
        totalShares: { type: number }
        shareClasses:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              votesPerShare: { type: number }
              liquidationPreference: { type: number }
        holders: { type: array, items: { $ref: '#/components/schemas/CapTableHolder' } }
        dataAsOf: { type: string, format: date-time }

    TeamShareCreate:
      type: object
      required: [householdId, advisorId]
      properties:
        householdId: { type: string }
        advisorId: { type: string, description: 'The colleague being given read access.' }
        reason: { type: string, nullable: true }

    TeamShare:
      type: object
      required: [id, householdId, sharedBy, sharedWith, access, sharedAt]
      properties:
        id: { type: string }
        householdId: { type: string }
        householdName: { type: string }
        sharedBy: { type: string }
        sharedByName: { type: string }
        sharedWith: { type: string }
        sharedWithName: { type: string }
        access: { type: string, enum: [read], description: 'Read only. The owning advisor stays the owner.' }
        direction: { type: string, enum: [in, out] }
        reason: { type: string, nullable: true }
        sharedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedBy: { type: string, nullable: true }

    TeamShareList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TeamShare' } }

    FeeOverrideUpdate:
      type: object
      properties:
        annualRatePct: { type: number, nullable: true, minimum: 0, maximum: 5, description: 'Null removes the override.' }
        reason: { type: string, description: 'Required when setting a rate.' }

    FeeOverride:
      type: object
      required: [householdId, overridden]
      properties:
        householdId: { type: string }
        householdName: { type: string }
        overridden: { type: boolean }
        annualRatePct: { type: number }
        scheduleRate: { type: number, description: 'What the schedule would have charged.' }
        reason: { type: string }
        setBy: { type: string }
        setAt: { type: string, format: date-time }

    FeePlan:
      type: object
      required: [schedule, canEditSchedule, dataAsOf]
      properties:
        schedule: { type: array, items: { $ref: '#/components/schemas/FeeTier' } }
        currency: { type: string }
        overrides: { type: array, items: { $ref: '#/components/schemas/FeeOverride' } }
        canEditSchedule: { type: boolean, description: 'True for a principal only.' }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        dataAsOf: { type: string, format: date-time }

    Model:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        riskLevel: { type: string, enum: [Conservative, Moderate, Aggressive] }
        target: { type: array, items: { type: number }, description: 'Target weights, in the order of the allocation asset classes.' }

    ModelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Model' } }

    ModelComparison:
      type: object
      required: [householdId, fromModel, toModel, lines, turnoverPct, placed]
      properties:
        householdId: { type: string }
        householdName: { type: string }
        aum: { type: number }
        fromModel: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        toModel: { type: object, properties: { id: { type: string }, name: { type: string } } }
        lines:
          type: array
          items:
            type: object
            properties:
              assetClass: { type: string }
              currentPct: { type: number }
              targetPct: { type: number }
              changePct: { type: number }
              changeValue: { type: number, description: 'The change in dollars at current assets.' }
        turnoverPct: { type: number, description: 'Half the sum of absolute changes.' }
        placed: { type: boolean, description: 'Always false. No trade can be placed from here.' }
        note: { type: string }
        dataAsOf: { type: string, format: date-time }

    PlaybookStep:
      type: object
      required: [id, title, dayOffset]
      properties:
        id: { type: string }
        title: { type: string }
        dayOffset: { type: integer, description: 'Days from the anchor date. Negative runs before it.' }

    Playbook:
      type: object
      required: [id, name, steps]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        steps: { type: array, items: { $ref: '#/components/schemas/PlaybookStep' } }

    PlaybookList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Playbook' } }

    PlaybookRunRequest:
      type: object
      properties:
        householdId: { type: string, nullable: true }
        anchorDate: { type: string, format: date, description: 'Defaults to today. Step offsets are relative to it.' }

    PlaybookRun:
      type: object
      required: [playbookId, tasks]
      properties:
        playbookId: { type: string }
        playbookName: { type: string }
        householdId: { type: string, nullable: true }
        householdName: { type: string, nullable: true }
        anchorDate: { type: string, format: date }
        tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }

    AdvisorMatch:
      type: object
      required: [advisorId, advisorName, score, reasons]
      properties:
        advisorId: { type: string }
        advisorName: { type: string }
        score: { type: number, description: '0 to 1. Fit against typical client size, weighted with spare capacity.' }
        households: { type: integer }
        typicalClientAssets: { type: number }
        reasons: { type: array, items: { type: string } }

    MatchList:
      type: object
      required: [prospectId, items]
      properties:
        prospectId: { type: string }
        prospectName: { type: string }
        estimatedAssets: { type: number, nullable: true }
        currentAdvisorId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/AdvisorMatch' } }
        note: { type: string }
        dataAsOf: { type: string, format: date-time }
