<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advisor platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EEF1F0; --surface: #FBFCFB; --ink: #16262D; --muted: #5B6B71; --line: #D5DCDA;
  --brand: #0E5A57; --brand-soft: #DCEBE9; --on-brand: #FFFFFF;
  --warn: #9A4A06; --warn-soft: #F6E7D8; --crit: #A3282F; --crit-soft: #F6DEDF; --ok: #2E7D4F; --ok-soft: #DDEFE3;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A1E; --surface: #16252A; --ink: #E6EEEC; --muted: #93A4A9; --line: #263A40;
    --brand: #5CC0B8; --brand-soft: #1B3A3B; --on-brand: #0F1A1E;
    --warn: #E0A15B; --warn-soft: #3A2A18; --crit: #EE8A8F; --crit-soft: #3B1E21; --ok: #6CC494; --ok-soft: #1B3527;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A1E; --surface: #16252A; --ink: #E6EEEC; --muted: #93A4A9; --line: #263A40;
  --brand: #5CC0B8; --brand-soft: #1B3A3B; --on-brand: #0F1A1E;
  --warn: #E0A15B; --warn-soft: #3A2A18; --crit: #EE8A8F; --crit-soft: #3B1E21; --ok: #6CC494; --ok-soft: #1B3527;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 56px; }

/* header */
.demo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; margin-bottom: 20px; }
.demo select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top h1 { font: 600 30px/1.15 var(--serif); margin: 0 0 4px; letter-spacing: -0.01em; }
.top p { margin: 0; color: var(--muted); }
.who { display: flex; align-items: center; gap: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tabs button { background: none; border: 0; padding: 5px 14px; border-radius: 6px; font-size: 14px; }
.tabs button[aria-selected="true"], .tabs button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }

/* summary strip */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); margin: 24px 0 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.strip.three { grid-template-columns: repeat(3, 1fr); }
.stat { padding: 18px 20px 16px 0; }
.stat + .stat { padding-left: 20px; border-left: 1px solid var(--line); }
.stat dt { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
.stat dd { margin: 0; }
.figure { font: 600 30px/1.1 var(--serif); letter-spacing: -0.01em; }
.sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.up { color: var(--ok); font-weight: 500; }
.neg { color: var(--crit); }
.spark { display: block; margin-top: 8px; width: 100%; max-width: 180px; height: 34px; }

/* layout */
.grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.col { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.panel.wide { grid-column: 1 / -1; }
.panel h2 { font: 600 19px/1.2 var(--serif); margin: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13px; }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.meet { position: relative; padding: 0 0 16px 28px; }
.meet:last-child { padding-bottom: 0; }
.meet::before { content: ""; position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.meet.next::before { background: var(--brand); border-color: var(--brand); }
.meet-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.time { font-weight: 600; min-width: 68px; font-variant-numeric: tabular-nums; }
.client { font-weight: 500; }
.type { color: var(--muted); font-size: 14px; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
.badge.ready, .badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.prep, .badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.next { background: var(--brand-soft); color: var(--brand); }
.badge.crit { background: var(--crit-soft); color: var(--crit); }
.badge.plain { background: var(--bg); color: var(--muted); }
details.brief { margin: 6px 0 0 78px; }
details.brief summary { cursor: pointer; color: var(--brand); font-size: 14px; }
details.brief p { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch; }

/* lists */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rows > li:first-child { border-top: 0; padding-top: 0; }
.rows > li:last-child { padding-bottom: 0; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 500; }
.meta { color: var(--muted); font-size: 13px; }
.sev { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
.sev.high { background: var(--crit); } .sev.medium { background: var(--warn); } .sev.low { background: var(--muted); }
.actions { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: transparent; padding: 5px 12px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { color: var(--on-brand); opacity: .9; }
.btn.quiet { border-color: transparent; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--brand); text-align: left; font-weight: 500; }
.link:hover { text-decoration: underline; }
.subrows { flex-basis: 100%; margin: 6px 0 0; padding: 0; list-style: none; border-left: 2px solid var(--brand-soft); padding-left: 12px; }
.subrows li { padding: 4px 0; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.task label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.task input { margin-top: 4px; accent-color: var(--brand); width: 16px; height: 16px; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 12px; color: var(--brand); background: var(--brand-soft); padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
.due-hot { color: var(--warn); font-weight: 500; }
.count { font: 600 22px/1 var(--serif); min-width: 40px; font-variant-numeric: tabular-nums; }

/* tables */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 13px; }
th button { background: none; border: 0; padding: 0; color: inherit; font-weight: 500; }
th button[aria-sort]::after { content: " \2195"; opacity: .5; }
th button[aria-sort="ascending"]::after { content: " \2191"; opacity: 1; }
th button[aria-sort="descending"]::after { content: " \2193"; opacity: 1; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 20px; }
tr:last-child td { border-bottom: 0; }
.pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: var(--muted); }

/* forms */
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label, .field legend { font-size: 13px; color: var(--muted); }
.field input[type=text], .field input[type=datetime-local], .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
fieldset.field { border: 0; padding: 0; margin: 0 0 12px; }
.checks { display: flex; gap: 16px; flex-wrap: wrap; }
.checks label { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; }
.checks input { accent-color: var(--brand); width: 16px; height: 16px; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 22px 24px; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(10, 20, 24, .55); }
dialog h2 { font: 600 22px/1.2 var(--serif); margin: 0 0 4px; }
dialog .close { float: right; }
dl.defs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; margin: 14px 0; }
dl.defs dt { color: var(--muted); font-size: 13px; }
dl.defs dd { margin: 0; font-variant-numeric: tabular-nums; }
dialog h3 { font: 600 16px/1.2 var(--serif); margin: 20px 0 8px; }

/* states */
.skel { height: 14px; border-radius: 4px; background: var(--line); margin: 10px 0; opacity: .6; }
.skel.s { width: 55%; } .skel.m { width: 80%; }
.err { color: var(--crit); font-size: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 10; }
.toast.show { opacity: 1; }
footer { margin-top: 28px; color: var(--muted); font-size: 13px; }

@media (max-width: 860px) {
  .grid, .grid.even { grid-template-columns: 1fr; }
  .strip, .strip.three { grid-template-columns: 1fr 1fr; }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  details.brief { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* Sections inside a view, and the components the ported features need. */
.subnav { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 0 18px; border-bottom: 1px solid var(--line); }
.subnav button { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
  font: 500 14px/1 var(--sans); padding: 10px 14px; cursor: pointer; }
.subnav button:hover { color: var(--ink); }
.subnav button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.subnav button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }

.draft { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; margin: 8px 0 14px; font-size: 14px; line-height: 1.55; }

.kanban { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.kcol h3 { font: 600 12px/1 var(--sans); text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.kcol .empty { font-size: 12px; padding: 8px 0; }
.kcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; background: var(--surface); }
.kcard:hover { border-color: var(--brand); }
.kcard:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.kcard .title { font-size: 14px; font-weight: 500; }

.onb { border-bottom: 1px solid var(--line); padding: 14px 0; }
.onb:last-child { border-bottom: 0; }
.onb-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.steps { list-style: none; margin: 10px 0 0; padding: 0; }
.step { padding: 4px 0; font-size: 14px; }
.step label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.step.not_started .link { color: var(--muted); }

.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cdow { background: var(--surface); color: var(--muted); font: 600 11px/1 var(--sans); text-transform: uppercase;
  letter-spacing: .04em; padding: 8px 6px; text-align: center; }
.cday { background: var(--surface); min-height: 88px; padding: 6px; position: relative; }
.cday.out { background: var(--bg); }
.cday.today .dnum { background: var(--brand); color: var(--on-brand); border-radius: 50%; }
.dnum { font-size: 12px; color: var(--muted); width: 20px; height: 20px; display: grid; place-items: center; }
.cmeet { display: block; width: 100%; text-align: left; font: 500 11px/1.3 var(--sans); background: var(--brand-soft);
  color: var(--ink); border: 0; border-radius: 4px; padding: 3px 5px; margin-top: 3px; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmeet:hover { outline: 1px solid var(--brand); }
.cadd { position: absolute; top: 4px; right: 4px; opacity: 0; background: none; border: 0; color: var(--muted);
  font-size: 15px; cursor: pointer; line-height: 1; padding: 2px 5px; }
.cday:hover .cadd, .cadd:focus-visible { opacity: 1; }

.meters { list-style: none; margin: 0; padding: 0; }
.meters li { margin-bottom: 12px; }
.meter-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.meter { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--brand); }
.meter span.hot { background: var(--warn); }

@media (max-width: 860px) {
  .kanban { grid-template-columns: repeat(6, 160px); }
  .cday { min-height: 64px; }
  .cadd { opacity: 1; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demo" hidden>
    <span id="demoText"></span>
    <span>Sign in as</span>
    <div class="tabs" id="personas" role="group" aria-label="Sign in as">
      <button data-persona="dana" aria-pressed="true">Dana, principal and advisor</button>
      <button data-persona="marcus" aria-pressed="false">Marcus, advisor</button>
      <button data-persona="grace" aria-pressed="false">Grace, client</button>
    </div>
  </div>

  <header class="top">
    <div>
      <h1 id="greeting">&nbsp;</h1>
      <p id="subhead">&nbsp;</p>
    </div>
    <div class="who">
      <div class="tabs" id="tabs" role="tablist" aria-label="View" hidden></div>
      <div class="avatar" id="avatar" aria-hidden="true"></div>
    </div>
  </header>

  <div id="view"></div>
  <footer id="foot"></footer>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   1. CONFIG: the only block to edit when connecting to the real backend.
   ===================================================================== */
const CONFIG = Object.assign({
  mode: 'mock',                 // 'mock' = in-page mock; 'live' = call a backend
  baseUrl: '',                  // backend host; the /v1 prefix is added by api()
  personaPicker: false,         // live mode only: show the sign-in-as buttons (for the standalone mock server)
  getToken: null                // async () => bearer token; defaults to the chosen persona when personaPicker is on
}, window.ADVISOR_CONFIG || {});
let currentPersona = 'dana';
if (!CONFIG.getToken) CONFIG.getToken = async () => (CONFIG.personaPicker ? currentPersona : null);
const FAIL = new URLSearchParams(location.search).get('fail'); // mock only: ?fail=alerts shows an error state

/* =====================================================================
   2. MOCK BACKEND: implements every operation in the v0.3 OpenAPI file
   on one consistent dataset. Delete this section in production.
   ===================================================================== */
function createMock() {
  const T0 = new Date(); T0.setHours(0, 0, 0, 0);
  const dayISO = (off, h = 0, m = 0) => { const d = new Date(T0); d.setDate(d.getDate() + off); d.setHours(h, m, 0, 0); return d.toISOString(); };
  const dateOnly = (off) => { const d = new Date(T0); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const hash = (s) => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
  const NOW = () => new Date().toISOString();

  const FIRM = { id: 'f1', name: 'Whitfield Wealth Partners' };
  const PERSONAS = {
    dana:   { id: 'u_dana',   name: 'Dana Whitfield', role: 'Principal and senior advisor', roles: ['principal', 'advisor'], views: ['firm', 'advisor'], advisorId: 'adv1' },
    marcus: { id: 'u_marcus', name: 'Marcus Bell',    role: 'Advisor',                      roles: ['advisor'],              views: ['advisor'],         advisorId: 'adv2' },
    grace:  { id: 'u_grace',  name: 'Grace Okafor',   role: 'Client',                       roles: ['client'],               views: ['client'],          householdId: 'h3' }
  };
  let persona = 'dana';
  const user = () => PERSONAS[persona];
  const isRole = (r) => user().roles.includes(r);

  const ADVISORS = [
    { id: 'adv1', name: 'Dana Whitfield' }, { id: 'adv2', name: 'Marcus Bell' },
    { id: 'adv3', name: 'Elena Park' },     { id: 'adv4', name: 'Tom Reyes' }
  ];
  const advName = (id) => ADVISORS.find(a => a.id === id).name;

  // id, name, advisor, assets ($M), 30-day change, days since contact, status
  const HH_ROWS = [
    ['h1', 'Lindqvist Family Trust', 'adv1', 18.4, 0.021, 6, 'needs_review'],
    ['h2', 'Halvorsen Estate', 'adv1', 14.9, 0.012, 12, 'on_track'],
    ['h3', 'Okafor household', 'adv1', 9.7, 0.008, 3, 'on_track'],
    ['h4', 'Nakamura household', 'adv1', 7.2, -0.006, 21, 'on_track'],
    ['h5', 'Delacroix household', 'adv1', 5.8, 0.004, 92, 'overdue_contact'],
    ['h6', 'Priya and Marcus Shah', 'adv1', 3.1, 0, 0, 'onboarding'],
    ['h7', 'Bergstrom household', 'adv1', 2.6, -0.011, 34, 'forms_incomplete'],
    ['h8', 'Whitcombe household', 'adv1', 11.3, 0.017, 9, 'on_track'],
    ['h9', 'Alvarado household', 'adv1', 6.4, 0.005, 15, 'on_track'],
    ['h10', 'Petrov household', 'adv1', 4.5, -0.002, 27, 'on_track'],
    ['h11', 'Abernathy household', 'adv2', 12.8, 0.014, 5, 'on_track'],
    ['h12', 'Castellano household', 'adv2', 10.2, 0.009, 8, 'on_track'],
    ['h13', 'Ito household', 'adv2', 9.1, -0.004, 19, 'needs_review'],
    ['h14', 'Fairweather Trust', 'adv2', 8.4, 0.011, 14, 'on_track'],
    ['h15', 'Guerrero household', 'adv2', 7.7, 0.003, 30, 'needs_review'],
    ['h16', 'Hollis household', 'adv2', 6.5, 0.006, 11, 'on_track'],
    ['h17', 'Jankowski household', 'adv2', 4.9, -0.008, 44, 'on_track'],
    ['h18', 'Kessler household', 'adv2', 3.2, 0.002, 7, 'on_track'],
    ['h19', 'Lindgren household', 'adv3', 13.5, 0.019, 4, 'on_track'],
    ['h20', 'Moreau household', 'adv3', 10.9, 0.007, 13, 'on_track'],
    ['h21', 'Nwosu household', 'adv3', 8.8, 0.01, 22, 'on_track'],
    ['h22', 'Osei household', 'adv3', 7.4, -0.003, 61, 'overdue_contact'],
    ['h23', 'Pruitt household', 'adv3', 5.6, 0.004, 17, 'on_track'],
    ['h24', 'Quill household', 'adv3', 3.3, 0.001, 25, 'on_track'],
    ['h25', 'Rasmussen household', 'adv4', 9.2, 0.008, 10, 'on_track'],
    ['h26', 'Santoro household', 'adv4', 6.1, 0.005, 16, 'on_track'],
    ['h27', 'Tanaka household', 'adv4', 3.8, -0.002, 33, 'on_track'],
    ['h28', 'Underhill household', 'adv4', 2.4, 0, 2, 'forms_incomplete']
  ];
  const ACCT_TYPES = ['Joint brokerage', 'Traditional IRA', 'Roth IRA', 'Trust account'];
  const HH = HH_ROWS.map(([id, name, advisorId, aumM, change30d, days, status]) => {
    const aum = Math.round(aumM * 1e6);

    stepsComplete: o.steps.filter(s => s.status === 'done').length, stepsTotal: o.steps.length,
    readyToConvert: o.steps.every(s => s.status === 'done') && !o.convertedAt });

  // Illustrative AI output. Drafts only: an advisor turns these into tasks, nothing does it for them.
  const NEXT_STEPS = {
    m5: [
      { title: 'Model gifting at $50k and $100k before the exemption changes', dueDate: dateOnly(5), householdId: 'h8' },
      { title: 'Note the son\'s spring house purchase in the file', dueDate: dateOnly(2), householdId: 'h8' }
    ],
    m6: [
      { title: 'Draft a three-tranche plan for the idle cash', dueDate: dateOnly(3), householdId: 'h9' },
      { title: 'Confirm the house sale is not proceeding', dueDate: dateOnly(1), householdId: 'h9' }
    ],
    m13: [
      { title: 'Build a multi-year trim plan for the technology holding', dueDate: dateOnly(6), householdId: 'h4' }
    ]
  };

  /* ---- routes ---- */
  const routes = [
    ['GET', /^\/session$/, () => { const u = user(); return ok({ id: u.id, name: u.name, role: u.role, roles: u.roles, views: u.views, firm: FIRM }); }],

    ['GET', /^\/summary$/, () => {
      if (!isRole('advisor')) return forbid();
      const id = user().advisorId, hs = myHH(), [ws, we] = weekBounds();
      const open = tasksFor(id).filter(t => t.status === 'open');
      return ok({
        aum: aumBlock(hs.reduce((a, h) => a + h.aum, 0)), households: hs.length,
        meetingsThisWeek: meetingsFor(id).filter(m => new Date(m.startsAt) >= ws && new Date(m.startsAt) < we).length,
        tasksOpen: open.length, tasksDueToday: open.filter(t => t.dueDate === dateOnly(0)).length, dataAsOf: NOW() });
    }],

    ['GET', /^\/households$/, (m, q) => {
      let list;
      if (q.scope === 'firm') { if (!isRole('principal')) return forbid(); list = HH; }
      else { if (!isRole('advisor')) return forbid(); list = myHH(); }
      if (q.status) list = list.filter(h => h.status === q.status);
      return ok(paged(list.map(hhSummary), q, 'aum,desc'));
    }],
    ['GET', /^\/households\/([^/]+)$/, (m) => {
      if (!isRole('advisor') && !isRole('principal')) return forbid();
      const h = hhById(m[1]); if (!h) return notFound('Household');
      if (!isRole('principal') && h.advisorId !== user().advisorId) return notFound('Household');
      return ok({ ...hhSummary(h), accounts: h.accounts });
    }],
    ['POST', /^\/households\/([^/]+)\/shares$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const h = hhById(m[1]); if (!h || h.advisorId !== user().advisorId) return notFound('Household');
      if (!b || !b.type || !b.sourceId || !b.title) return fail(400, 'bad_request', 'Type, sourceId and title are required.');
      const s = { id: 'sh' + (++seq), householdId: h.id, type: b.type, title: b.title, message: b.message || null, sharedAt: NOW(), sharedBy: user().name, contentUrl: null };
      SHARED.unshift(s);
      const { householdId, ...out } = s; return created(out);
    }],

    ['GET', /^\/meetings$/, (m, q) => {
      if (!isRole('advisor')) return forbid();
      const from = q.from || dateOnly(0), to = q.to || from;
      const list = meetingsFor(user().advisorId).filter(x => { const d = new Date(x.startsAt); const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); return ds >= from && ds <= to; })
        .sort((a, b) => a.startsAt.localeCompare(b.startsAt))
        .map(({ advisorId, brief, ...x }) => ({ ...x, householdName: hhName(x.householdId), prospectName: prospectName(x.id), brief: null }));
      return ok({ items: list });
    }],
    ['GET', /^\/meetings\/([^/]+)$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const x = MEETINGS.find(y => y.id === m[1] && y.advisorId === user().advisorId); if (!x) return notFound('Meeting');
      const { advisorId, ...out } = x;
      return ok({ ...out, householdName: hhName(x.householdId), prospectName: prospectName(x.id), briefSources: ['greenmeadows', 'crm', 'calendar'] });
    }],

    ['GET', /^\/tasks$/, (m, q) => {
      if (!isRole('advisor')) return forbid();
      let list = tasksFor(user().advisorId);
      if (q.status) list = list.filter(t => t.status === q.status);
      if (q.dueBy) list = list.filter(t => t.dueDate && t.dueDate <= q.dueBy);
      list = [...list].sort((a, b) => (a.status === b.status ? (a.dueDate || '9999').localeCompare(b.dueDate || '9999') : a.status === 'open' ? -1 : 1));
      return ok({ items: list.map(publicTask), openCount: tasksFor(user().advisorId).filter(t => t.status === 'open').length });
    }],
    ['POST', /^\/tasks$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      if (!b || !b.title) return fail(400, 'bad_request', 'Title is required.');
      const t = { id: 't' + (++seq), advisorId: user().advisorId, title: b.title, householdId: b.householdId || null, dueDate: b.dueDate || null, origin: b.origin || 'manual', originMeetingId: b.originMeetingId || null, status: 'open', createdAt: NOW() };
      TASKS.push(t); return created(publicTask(t));
    }],
    ['PATCH', /^\/tasks\/([^/]+)$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const t = TASKS.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!t) return notFound('Task');
      Object.assign(t, ['title', 'dueDate', 'status'].reduce((o, k) => (b && k in b ? { ...o, [k]: b[k] } : o), {}));
      return ok(publicTask(t));
    }],

    ['GET', /^\/alerts$/, (m, q) => {
      let list;
      if (q.scope === 'firm') { if (!isRole('principal')) return forbid(); list = ALERTS; }
      else { if (!isRole('advisor')) return forbid(); list = ALERTS.filter(a => a.advisorId === user().advisorId); }
      list = list.filter(a => a.status === (q.status || 'open'));
      if (q.severity) list = list.filter(a => a.severity === q.severity);
      const order = { high: 0, medium: 1, low: 2 };
      list = [...list].sort((a, b) => order[a.severity] - order[b.severity] || b.createdAt.localeCompare(a.createdAt));
      return ok({ items: list.map(alertOut) });
    }],
    ['PATCH', /^\/alerts\/([^/]+)$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const a = ALERTS.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!a) return notFound('Alert');
      if (!b || !['open', 'dismissed', 'resolved'].includes(b.status)) return fail(400, 'bad_request', 'Status must be open, dismissed or resolved.');
      a.status = b.status; return ok(alertOut(a));
    }],

    ['GET', /^\/portfolio-signals$/, () => {
      if (!isRole('advisor')) return forbid();
      const mine = SIGNAL_ROWS.filter(s => s.advisorId === user().advisorId);
      const items = Object.keys(SIGNAL_META).map(kind => {
        const rows = mine.filter(s => s.kind === kind); if (!rows.length) return null;
        return { id: 'sig_' + kind, kind, count: rows.length, label: SIGNAL_META[kind].label, detail: SIGNAL_META[kind].detail(rows.map(r => r.value)), dataAsOf: NOW() };
      }).filter(Boolean);
      return ok({ items });
    }],
    ['GET', /^\/portfolio-signals\/([^/]+)\/items$/, (m, q) => {
      if (!isRole('advisor')) return forbid();
      const kind = m[1].replace(/^sig_/, ''); if (!SIGNAL_META[kind]) return notFound('Signal');
      const rows = SIGNAL_ROWS.filter(s => s.advisorId === user().advisorId && s.kind === kind).map(s => {
        const h = hhById(s.householdId);
        return { householdId: h.id, householdName: h.name, maskedAccountNumber: h.accounts[hash(s.id) % h.accounts.length].maskedNumber, detail: itemDetail(s), amount: ['tax_loss_harvesting', 'idle_cash'].includes(kind) ? s.value : null };
      });
      const size = +q.size || 20, page = +q.page || 0;
      return ok({ items: rows.slice(page * size, page * size + size), page, size, totalItems: rows.length });
    }],

    /* ---- communications (COMM-01 to COMM-03). Drafts are AI output; an advisor must approve
       before anything leaves the firm (X-03), and approval is recorded. ---- */
    ['GET', /^\/communications$/, (m, q) => {
      let list;
      if (q.scope === 'firm') { if (!isRole('principal')) return forbid(); list = COMMS; }
      else { if (!isRole('advisor')) return forbid(); list = COMMS.filter(c => c.advisorId === user().advisorId); }
      if (q.status) list = list.filter(c => c.status === q.status);
      if (q.complianceReview === 'true') list = list.filter(c => c.complianceReview);
      return ok(paged(list.map(commRow), q, 'createdAt,desc'));
    }],
    ['GET', /^\/communications\/([^/]+)$/, (m) => {
      if (!isRole('advisor') && !isRole('principal')) return forbid();
      const c = COMMS.find(x => x.id === m[1]); if (!c) return notFound('Message');
      if (!isRole('principal') && c.advisorId !== user().advisorId) return notFound('Message');
      return ok({ ...commRow(c), body: c.body });
    }],
    ['PATCH', /^\/communications\/([^/]+)$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const c = COMMS.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!c) return notFound('Message');
      if (!b || !['approved', 'sent', 'draft'].includes(b.status)) return fail(400, 'bad_request', 'Status must be draft, approved or sent.');
      if (b.status === 'sent' && c.status === 'draft') return fail(409, 'conflict', 'A draft must be approved before it is sent.');
      c.status = b.status;
      if (b.status === 'draft') { c.approvedBy = null; c.approvedAt = null; c.sentAt = null; }
      else { c.approvedBy = user().name; c.approvedAt = c.approvedAt || NOW(); if (b.status === 'sent') c.sentAt = NOW(); }
      return ok({ ...commRow(c), body: c.body });
    }],

    /* ---- prospects (GP-01, GP-02) ---- */
    ['GET', /^\/prospects$/, (m, q) => {
      if (!isRole('advisor')) return forbid();
      let list = PROSPECTS.filter(p => p.advisorId === user().advisorId);
      if (q.stage) list = list.filter(p => p.stage === q.stage);
      return ok({ stages: PROSPECT_STAGES, ...paged(list.map(prospectRow), q, 'updatedAt,desc') });
    }],
    ['GET', /^\/prospects\/([^/]+)$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const p = PROSPECTS.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!p) return notFound('Prospect');
      return ok({ ...prospectRow(p), intakeNotes: p.intakeNotes });
    }],
    ['PATCH', /^\/prospects\/([^/]+)$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const p = PROSPECTS.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!p) return notFound('Prospect');
      if (!b || !PROSPECT_STAGES.includes(b.stage)) return fail(400, 'bad_request', 'Stage must be one of: ' + PROSPECT_STAGES.join(', ') + '.');
      p.stage = b.stage; p.updatedAt = NOW();
      return ok({ ...prospectRow(p), intakeNotes: p.intakeNotes });
    }],

    /* ---- onboarding (AX-01 to AX-04) ---- */
    ['GET', /^\/onboarding$/, () => {
      if (!isRole('advisor')) return forbid();
      return ok({ items: ONBOARDING.filter(o => o.advisorId === user().advisorId).map(onbRow) });
    }],
    ['GET', /^\/onboarding\/([^/]+)$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const o = ONBOARDING.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!o) return notFound('Onboarding client');
      return ok(onbRow(o));
    }],
    ['PATCH', /^\/onboarding\/([^/]+)\/steps\/([^/]+)$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const o = ONBOARDING.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!o) return notFound('Onboarding client');
      const s = o.steps.find(x => x.id === m[2]); if (!s) return notFound('Step');
      if (!b || !['done', 'open', 'not_started'].includes(b.status)) return fail(400, 'bad_request', 'Status must be done, open or not_started.');
      s.status = b.status; s.completedAt = b.status === 'done' ? NOW() : null;
      return ok(onbRow(o));
    }],
    ['POST', /^\/onboarding\/([^/]+)\/convert$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const o = ONBOARDING.find(x => x.id === m[1] && x.advisorId === user().advisorId); if (!o) return notFound('Onboarding client');
      if (o.convertedAt) return fail(409, 'conflict', 'This client has already been converted.');
      const outstanding = o.steps.filter(s => s.status !== 'done');
      if (outstanding.length) return fail(409, 'conflict', 'These steps are not complete: ' + outstanding.map(s => s.label).join(', ') + '.');
      o.convertedAt = NOW();
      const h = { id: 'h' + (++seq), name: o.name, advisorId: o.advisorId, aum: 0, change30d: 0, status: 'onboarding',
        accounts: [], lastContactAt: NOW() };
      HH.push(h);
      return created({ onboardingId: o.id, householdId: h.id, name: h.name, convertedAt: o.convertedAt });
    }],

    /* ---- book migration. Not in the 75 requirements: an implementation concern that has to
       exist before a firm can move its book onto the platform. Real imports are asynchronous. ---- */
    ['GET', /^\/migrations$/, () => {
      if (!isRole('advisor')) return forbid();
      return ok({ items: MIGRATIONS.filter(x => x.advisorId === user().advisorId) });
    }],
    ['POST', /^\/migrations$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      if (!b || !b.source || !Array.isArray(b.rows)) return fail(400, 'bad_request', 'Source and rows are required.');
      if (!b.rows.length) return fail(400, 'bad_request', 'At least one row is required.');
      const valid = [], invalid = [];
      b.rows.forEach((r, i) => {
        const problems = [];
        if (!r || !r.name) problems.push('name is missing');
        if (r && r.aum != null && !(typeof r.aum === 'number' && r.aum >= 0)) problems.push('aum is not a positive number');
        (problems.length ? invalid : valid).push(problems.length ? { row: i, problems } : r);
      });
      const created_ = valid.map(r => {
        const h = { id: 'h' + (++seq), name: r.name, advisorId: user().advisorId, aum: Math.round(r.aum || 0), change30d: 0,
          status: 'needs_review', accounts: [], lastContactAt: null };
        HH.push(h); return h.id;
      });
      const mig = { id: 'mig' + (++seq), advisorId: user().advisorId, source: b.source, status: 'imported',
        counts: { read: b.rows.length, valid: valid.length, invalid: invalid.length, imported: created_.length },
        invalidRows: invalid, createdHouseholdIds: created_, createdAt: NOW() };
      MIGRATIONS.unshift(mig);
      return created(mig);
    }],

    /* ---- calendar: meetings are created, moved and cancelled here (MEET-03) ---- */
    ['POST', /^\/meetings$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      if (!b || !b.startsAt || !b.type) return fail(400, 'bad_request', 'startsAt and type are required.');
      if (Number.isNaN(Date.parse(b.startsAt))) return fail(400, 'bad_request', 'startsAt must be an ISO 8601 date-time.');
      if (b.householdId && !(hhById(b.householdId) || {}).id) return notFound('Household');
      if (b.householdId && hhById(b.householdId).advisorId !== user().advisorId) return notFound('Household');
      const x = { id: 'm' + (++seq), advisorId: user().advisorId, householdId: b.householdId || null,
        startsAt: new Date(b.startsAt).toISOString(), type: b.type, prepStatus: 'needs_prep',
        durationMinutes: b.durationMinutes || 30, brief: b.brief || null };
      MEETINGS.push(x);
      const { advisorId, ...out } = x;
      return created({ ...out, householdName: hhName(x.householdId), prospectName: prospectName(x.id) });
    }],
    ['PATCH', /^\/meetings\/([^/]+)$/, (m, q, b) => {
      if (!isRole('advisor')) return forbid();
      const x = MEETINGS.find(y => y.id === m[1] && y.advisorId === user().advisorId); if (!x) return notFound('Meeting');
      if (b && b.startsAt && Number.isNaN(Date.parse(b.startsAt))) return fail(400, 'bad_request', 'startsAt must be an ISO 8601 date-time.');
      for (const k of ['startsAt', 'type', 'durationMinutes', 'prepStatus', 'brief']) if (b && k in b) x[k] = b[k];
      if (b && b.startsAt) x.startsAt = new Date(b.startsAt).toISOString();
      const { advisorId, ...out } = x;
      return ok({ ...out, householdName: hhName(x.householdId), prospectName: prospectName(x.id) });
    }],
    ['DELETE', /^\/meetings\/([^/]+)$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const i = MEETINGS.findIndex(y => y.id === m[1] && y.advisorId === user().advisorId); if (i < 0) return notFound('Meeting');
      MEETINGS.splice(i, 1);
      return { status: 204, data: undefined };
    }],

    /* ---- meeting records (MEET-04 to MEET-07). A transcript without recorded consent is
       withheld: consent is a precondition for disclosure, not a label on it. ---- */
    ['GET', /^\/meetings\/([^/]+)\/record$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const x = MEETINGS.find(y => y.id === m[1] && y.advisorId === user().advisorId); if (!x) return notFound('Meeting');
      const r = RECORDS.find(y => y.meetingId === x.id); if (!r) return notFound('Record');
      const withheld = r.kind === 'transcript' && !(r.consent && r.consent.obtained);
      return ok({ meetingId: r.meetingId, kind: r.kind, author: r.author, source: r.source, consent: r.consent,
        capturedAt: x.startsAt, withheld, content: withheld ? null : r.content,
        withheldReason: withheld ? 'Recording consent is not on file for this meeting.' : null });
    }],
    ['POST', /^\/meetings\/([^/]+)\/record\/next-steps$/, (m) => {
      if (!isRole('advisor')) return forbid();
      const x = MEETINGS.find(y => y.id === m[1] && y.advisorId === user().advisorId); if (!x) return notFound('Meeting');
      const r = RECORDS.find(y => y.meetingId === x.id); if (!r) return notFound('Record');
      if (r.kind === 'transcript' && !(r.consent && r.consent.obtained)) return fail(409, 'conflict', 'Recording consent is not on file for this meeting.');
      // Drafts only. Nothing becomes a task until the advisor posts it to /tasks (X-03).
      return ok({ meetingId: x.id, generatedAt: NOW(), accepted: false, model: 'mock-suggestion-v0',
        items: NEXT_STEPS[x.id] || [{ title: 'Write up ' + (hhName(x.householdId) || 'the meeting') + ' and file the notes', dueDate: dateOnly(1), householdId: x.householdId }] });
    }],

    /* ---- allocation against the household's model (PM-02, PM-03) ---- */
    ['GET', /^\/households\/([^/]+)\/allocation$/, (m) => {
      if (!isRole('advisor') && !isRole('principal')) return forbid();
      const h = hhById(m[1]); if (!h) return notFound('Household');
      if (!isRole('principal') && h.advisorId !== user().advisorId) return notFound('Household');
      const a = ALLOCATIONS[h.id];
      if (!a) return ok({ householdId: h.id, householdName: h.name, model: null, lines: [], maxDriftPoints: null, dataAsOf: NOW() });
      const lines = ALLOC_CLASSES.map((assetClass, i) => ({ assetClass, targetPct: a.target[i], currentPct: a.current[i],
        driftPct: +(a.current[i] - a.target[i]).toFixed(1) }));
      return ok({ householdId: h.id, householdName: h.name, model: { id: a.modelId, name: a.modelName },
        lines, maxDriftPoints: Math.max(...lines.map(l => Math.abs(l.driftPct))), source: 'greenmeadows', dataAsOf: NOW() });
    }],

    /* ---- what the firm charges its clients (AX-10, AX-11) ---- */
    ['GET', /^\/billing\/fees$/, (m, q) => {
      if (!isRole('advisor')) return forbid();
      const hs = myHH().filter(h => h.aum > 0);
      const rows = hs.map(h => ({ householdId: h.id, householdName: h.name, billableAssets: h.aum,
        annualRatePct: feeRate(h.aum), quarterlyFee: quarterlyFee(h.aum) }));
      return ok({ schedule: FEE_TIERS, nextRunDate: dateOnly(7), currency: 'USD',
        totalQuarterlyFees: rows.reduce((a, r) => a + r.quarterlyFee, 0), dataAsOf: NOW(),
        ...paged(rows, q, 'billableAssets,desc') });
    }],

    ['GET', /^\/firm\/summary$/, () => {
      if (!isRole('principal')) return forbid();
      const live = COMPLIANCE.filter(c => c.status !== 'done');
      return ok({ aum: aumBlock(HH.reduce((a, h) => a + h.aum, 0)), advisors: ADVISORS.length, households: HH.length,
        openComplianceItems: live.length, overdueComplianceItems: live.filter(c => c.status === 'overdue').length, dataAsOf: NOW() });
    }],
    ['GET', /^\/firm\/advisors$/, (m, q) => isRole('principal') ? ok(paged(ADVISORS.map(a => advisorRow(a.id)), q, 'aum,desc')) : forbid()],
    ['GET', /^\/firm\/advisors\/([^/]+)$/, (m) => !isRole('principal') ? forbid() : ADVISORS.some(a => a.id === m[1]) ? ok(advisorRow(m[1])) : notFound('Advisor')],
    ['GET', /^\/firm\/compliance$/, (m, q) => {
      if (!isRole('principal')) return forbid();
      let list = COMPLIANCE;
      if (q.status) list = list.filter(c => c.status === q.status);
      if (q.advisorId) list = list.filter(c => c.advisorId === q.advisorId);
      return ok(paged(list, q, 'dueDate,asc'));
    }],

    /* ---- what the firm pays for the platform (PO-10). Principal only: an advisor has no
       business seeing the firm's payment method or invoices. ---- */
    ['GET', /^\/firm\/billing\/subscription$/, () => {
      if (!isRole('principal')) return forbid();
      const current = INVOICES[0];
      return ok({ ...SUBSCRIPTION, currentInvoice: { id: current.id, number: current.number, amount: current.amount, dueDate: current.dueDate, status: current.status }, dataAsOf: NOW() });
    }],
    ['GET', /^\/firm\/billing\/invoices$/, (m, q) => {
      if (!isRole('principal')) return forbid();
      return ok(paged(INVOICES.map(({ lines, ...i }) => i), q, 'issuedDate,desc'));
    }],
    ['GET', /^\/firm\/billing\/invoices\/([^/]+)$/, (m) => {
      if (!isRole('principal')) return forbid();
      const i = INVOICES.find(x => x.id === m[1]); if (!i) return notFound('Invoice');
      return ok(i);
    }],

    /* ---- branding (GP-07, GP-10). Readable by anyone signed in, because the client portal is
       branded too; only a principal may change it. It holds no client data. ---- */
    ['GET', /^\/firm\/branding$/, () => ok({ ...BRANDING, firmId: FIRM.id })],
    ['PATCH', /^\/firm\/branding$/, (m, q, b) => {
      if (!isRole('principal')) return forbid();
      if (b && 'accentColor' in b && !/^#[0-9a-fA-F]{6}$/.test(b.accentColor)) return fail(400, 'bad_request', 'accentColor must be a six-digit hex colour, for example #0E5A57.');
      if (b && 'markLetter' in b && String(b.markLetter).length !== 1) return fail(400, 'bad_request', 'markLetter must be a single character.');
      for (const k of ['firmName', 'advisorDisplayName', 'markLetter', 'accentColor']) if (b && k in b) BRANDING[k] = b[k];
      BRANDING.updatedAt = NOW(); BRANDING.updatedBy = user().name;
      return ok({ ...BRANDING, firmId: FIRM.id });
    }],

    ['GET', /^\/me\/household$/, () => {
      if (!isRole('client')) return forbid();
      const h = hhById(user().householdId);
      return ok({ id: h.id, name: h.name, aum: h.aum, change30d: h.change30d, trend: trend(h.aum), advisorName: advName(h.advisorId), dataAsOf: NOW(),
        accounts: h.accounts.map(({ maskedNumber, type, balance, todayGainLoss, totalGainLoss }) => ({ maskedNumber, type, balance, todayGainLoss, totalGainLoss })) });
    }],
    ['GET', /^\/me\/documents$/, (m, q) => {
      if (!isRole('client')) return forbid();
      let list = DOCS.filter(d => d.householdId === user().householdId);
      if (q.docType) list = list.filter(d => d.docType === q.docType);
      if (q.from) list = list.filter(d => d.date >= q.from);
      if (q.to) list = list.filter(d => d.date <= q.to);
      return ok(paged(list.map(({ householdId, ...d }) => ({ ...d, maskedAccountNumber: d.docType === 'statement' ? hhById(householdId).accounts[0].maskedNumber : null })), q, 'date,desc'));
    }],
    ['GET', /^\/me\/documents\/([^/]+)$/, (m) => {
      if (!isRole('client')) return forbid();
      const d = DOCS.find(x => x.id === m[1] && x.householdId === user().householdId); if (!d) return notFound('Document');
      return ok({ mockDownload: true, filename: d.title + '.pdf' });
    }],
    ['GET', /^\/me\/fees$/, () => {
      if (!isRole('client')) return forbid();
      // Billed off the same schedule the advisor sees at /billing/fees, so the two agree.
      const h = hhById(user().householdId), a = h.accounts[0], amt = quarterlyFee(h.aum);
      const q = (o) => ({ periodStart: dateOnly(o), periodEnd: dateOnly(o + 89) });
      return ok({ dataAsOf: NOW(), items: [
        { id: 'f1', maskedAccountNumber: a.maskedNumber, description: 'Advisory fee, prior quarter', amount: amt, ...q(-180), status: 'paid' },
        { id: 'f2', maskedAccountNumber: a.maskedNumber, description: 'Advisory fee, this quarter', amount: amt, ...q(-90), status: 'billed' },
        { id: 'f3', maskedAccountNumber: a.maskedNumber, description: 'Advisory fee, next quarter', amount: amt, ...q(0), status: 'scheduled' }] });
    }],
    ['GET', /^\/me\/shared$/, () => {
      if (!isRole('client')) return forbid();
      return ok({ items: SHARED.filter(s => s.householdId === user().householdId).map(({ householdId, ...s }) => s) });
    }],
    ['GET', /^\/me\/preferences$/, () => isRole('client') ? ok(PREFS[user().householdId]) : forbid()],
    ['PATCH', /^\/me\/preferences$/, (m, q, b) => {
      if (!isRole('client')) return forbid();
      const p = PREFS[user().householdId];
      if (b && 'paperless' in b) p.paperless = !!b.paperless;
      if (b && Array.isArray(b.notificationChannels)) p.notificationChannels = b.notificationChannels;
      return ok(p);
    }],
    ['POST', /^\/me\/meeting-requests$/, (m, q, b) => {
      if (!isRole('client')) return forbid();
      if (!b || !b.topic) return fail(400, 'bad_request', 'Topic is required.');
      const h = hhById(user().householdId);
      const r = { id: 'mr' + (++seq), status: 'requested', topic: b.topic, createdAt: NOW() };
      MEETING_REQUESTS.push(r);
      TASKS.push({ id: 't' + (++seq), advisorId: h.advisorId, title: 'Meeting request from ' + h.name + ': ' + b.topic, householdId: h.id, dueDate: dateOnly(1), origin: 'manual', originMeetingId: null, status: 'open', createdAt: NOW() });
      return created(r);
    }]
  ];

  function handle(method, path, query, body, personaKey) {
    // Every caller passes personaKey; the fallback to the last-used persona exists only for
    // setPersona(). Do not carry this pattern into the real backend: identity must come from
    // the request, never from instance state, or concurrent requests will see each other's user.
    if (personaKey) persona = personaKey;
    for (const [m, re, fn] of routes) {
      if (m !== method) continue;
      const match = path.match(re);
      if (match) return fn(match, query || {}, body);
    }
    return fail(404, 'not_found', 'No such operation: ' + method + ' ' + path);
  }
  return {
    handle,
    personas: () => Object.entries(PERSONAS).map(([token, u]) => ({ token, name: u.name, roles: u.roles, views: u.views })),
    setPersona: (p) => { persona = p; },
    get persona() { return persona; }
  };
}

/* =====================================================================
   3. API CLIENT: the only place that knows whether data is mock or live.
   ===================================================================== */
class ApiError extends Error { constructor(status, code, message) { super(message); this.status = status; this.code = code; } }
const wait = (ms) => new Promise(r => setTimeout(r, ms));

async function api(method, path, { query, body } = {}) {
  const clean = Object.fromEntries(Object.entries(query || {}).filter(([, v]) => v !== undefined && v !== ''));
  if (CONFIG.mode === 'mock') {
    await wait(120 + Math.random() * 220);
    if (FAIL && path.includes(FAIL)) throw new ApiError(500, 'mock_failure', "Couldn't load this section.");
    const r = Mock.handle(method, path, clean, body, currentPersona);
    if (r.status >= 400) throw new ApiError(r.status, r.data.code, r.data.message);
    return structuredClone(r.data);
  }
  const token = await CONFIG.getToken();
  const qs = Object.keys(clean).length ? '?' + new URLSearchParams(clean) : '';
  const res = await fetch(CONFIG.baseUrl + '/v1' + path + qs, {
    method,
    headers: { Accept: 'application/json', 'x-trace-id': crypto.randomUUID(),
      ...(body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) { let e = {}; try { e = await res.json(); } catch {} throw new ApiError(res.status, e.code, e.message || 'Request failed (' + res.status + ')'); }
  return res.json();
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 1 }).format(n);
const moneyFull = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
const pct = (n) => (n > 0 ? '+' : '') + (n * 100).toFixed(1) + '%';
const pctClass = (n) => (n < 0 ? 'neg' : n > 0 ? 'up' : '');
const fmtTime = (iso) => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const localDate = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const daysAgo = (iso) => {
  if (!iso) return 'No record';
  const n = Math.floor((Date.now() - new Date(iso)) / 864e5);
  return n <= 0 ? 'Today' : n === 1 ? 'Yesterday' : n + ' days ago';
};
function dueLabel(dateStr) {
  if (!dateStr) return { text: 'No due date', hot: false };
  const t = localDate(new Date()), tm = new Date(); tm.setDate(tm.getDate() + 1);
  if (dateStr < t) return { text: 'Overdue, ' + fmtDate(dateStr), hot: true };
  if (dateStr === t) return { text: 'Due today', hot: true };
  if (dateStr === localDate(tm)) return { text: 'Due tomorrow', hot: false };
  return { text: 'Due ' + new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }), hot: false };
}

/* Draws nothing rather than a misleading line when the backend sends no history. */
function spark(trend, label) {
  if (!Array.isArray(trend) || trend.length < 2) return '';
  const v = trend.map(p => p.value), w = 180, h = 34, min = Math.min(...v), max = Math.max(...v);
  const pts = v.map((x, i) => [(i / (v.length - 1)) * w, h - 3 - ((x - min) / (max - min || 1)) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '), last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--brand)"/></svg>`;
}

/* Loads a panel with loading, error and retry states. */
async function load(el, title, loader, render, after) {
  el.innerHTML = `<div class="panel-head"><h2>${esc(title)}</h2></div><div class="skel"></div><div class="skel m"></div><div class="skel s"></div>`;
  try {
    const d = await loader();
    el.innerHTML = render(d);
    if (after) after(el, d);
  } catch (e) {
    const msg = e.status === 403 ? "You don't have access to this section." : (e.message || "Couldn't load this section.");
    el.innerHTML = `<div class="panel-head"><h2>${esc(title)}</h2></div><div class="err"><span>${esc(msg)}</span>${e.status === 403 ? '' : '<button class="btn" data-retry>Try again</button>'}</div>`;
    const r = el.querySelector('[data-retry]'); if (r) r.onclick = () => load(el, title, loader, render, after);

/* ---- Onboarding, and importing a book ---- */
function advOnboarding() {
  $('section').innerHTML = `<div class="grid"><div class="col">${panel('w-onb')}</div><div class="col">${panel('w-mig')}</div></div>`;
  const run = () => load($('w-onb'), 'New clients', () => api('GET', '/onboarding'), (r) =>
    head('New clients', r.items.length + ' in progress') + (r.items.length ? r.items.map(o => `
      <article class="onb" data-onb="${esc(o.id)}"><div class="onb-head"><div><div class="title">${esc(o.name)}</div>
      <div class="meta">Started ${esc(daysAgo(o.startedAt).toLowerCase())} • ${o.stepsComplete} of ${o.stepsTotal} steps</div></div>
      <button class="btn primary" data-convert="${esc(o.id)}" ${o.readyToConvert ? '' : 'disabled'}>Convert to client</button></div>
      <ul class="steps">${o.steps.map(s => `<li class="step ${esc(s.status)}">
        <label><input type="checkbox" data-step="${esc(o.id)}:${esc(s.id)}" ${s.status === 'done' ? 'checked' : ''}>
        <span class="grow"><button class="link" data-detail="${esc(o.id)}:${esc(s.id)}">${esc(s.label)}</button></span></label></li>`).join('')}</ul></article>`).join('')
      : '<p class="empty">Nobody is onboarding right now.</p>'),
  (el) => {
    el.querySelectorAll('[data-step]').forEach(c => c.addEventListener('change', async () => {
      const [oid, sid] = c.dataset.step.split(':');
      try { await api('PATCH', `/onboarding/${encodeURIComponent(oid)}/steps/${encodeURIComponent(sid)}`, { body: { status: c.checked ? 'done' : 'open' } }); run(); }
      catch (e) { c.checked = !c.checked; toast(e.message); }
    }));
    el.querySelectorAll('[data-detail]').forEach(b => b.onclick = async () => {
      const [oid, sid] = b.dataset.detail.split(':');
      const dlg = $('dlg'); dlg.innerHTML = '<p class="empty">Loading…</p>'; dlg.showModal();
      try {
        const o = await api('GET', '/onboarding/' + encodeURIComponent(oid));
        const s = o.steps.find(x => x.id === sid);
        dlg.innerHTML = `<button class="btn quiet close" data-close>Close</button><h2 id="dlgTitle">${esc(s.label)}</h2>
          <div class="meta">${esc(o.name)}</div>
          <p class="draft">${esc(s.detail || 'Not started yet. Nothing has been captured for this step.')}</p>
          ${s.completedAt ? `<p class="hint">Completed ${esc(fmtDate(localDate(new Date(s.completedAt))))}.</p>` : ''}`;
      } catch (e) { dlg.innerHTML = `<button class="btn quiet close" data-close>Close</button><p class="err">${esc(e.message)}</p>`; }
    });
    el.querySelectorAll('[data-convert]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { const r = await api('POST', `/onboarding/${encodeURIComponent(b.dataset.convert)}/convert`); toast(r.name + ' is now in your book.'); run(); advLoadStrip(); }
      catch (e) { toast(e.message); b.disabled = false; }
    });
  });
  run();

  load($('w-mig'), 'Import a book', () => Promise.resolve(null), () =>
    head('Import a book', 'Migrate from another system') + `
    <p class="hint">Paste one household per line as <code>Name, assets</code>. Rows that fail validation are reported and skipped; the rest are imported and flagged for review.</p>
    <div class="field"><label for="migSrc">Where is it coming from?</label><input type="text" id="migSrc" value="Redtail export"></div>
    <div class="field"><label for="migRows">Households</label><textarea id="migRows" rows="6">Okonkwo household, 3200000
Vance Trust, 1400000
, 50
Bad Assets, -3</textarea></div>
    <button class="btn primary" id="migGo">Validate and import</button>
    <div id="migOut"></div>`,
  () => {
    $('migGo').onclick = async () => {
      const rows = $('migRows').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
        const i = l.lastIndexOf(','), name = (i < 0 ? l : l.slice(0, i)).trim(), n = i < 0 ? NaN : Number(l.slice(i + 1).trim());
        const row = {}; if (name) row.name = name; if (!Number.isNaN(n)) row.aum = n; return row;
      });
      if (!rows.length) { toast('Add at least one row.'); return; }
      const b = $('migGo'); b.disabled = true;
      try {
        const r = await api('POST', '/migrations', { body: { source: $('migSrc').value.trim() || 'Unknown', rows } });
        $('migOut').innerHTML = `<dl class="defs"><dt>Read</dt><dd>${r.counts.read}</dd><dt>Imported</dt><dd>${r.counts.imported}</dd><dt>Rejected</dt><dd>${r.counts.invalid}</dd></dl>`
          + (r.invalidRows.length ? `<ul class="rows">${r.invalidRows.map(x => `<li><div class="grow"><div class="title">Row ${x.row + 1}</div><div class="meta">${esc(x.problems.join('; '))}</div></div></li>`).join('')}</ul>` : '');
        toast(r.counts.imported + ' imported, flagged for review.');
        advLoadStrip();
      } catch (e) { toast(e.message); } finally { b.disabled = false; }
    };
  });
}

/* ---- Calendar ---- */
let calMonth = null;
function advCalendar() {
  const now = new Date();
  if (!calMonth) calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  $('section').innerHTML = `<div class="grid">${panel('w-cal', 'wide')}</div>`;
  const run = () => {
    const first = new Date(calMonth), last = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
    const from = localDate(first), to = localDate(last);
    load($('w-cal'), 'Calendar', () => api('GET', '/meetings', { query: { from, to } }), (r) => {
      const byDay = {};
      for (const m of r.items) (byDay[localDate(new Date(m.startsAt))] ||= []).push(m);
      const lead = (first.getDay() + 6) % 7, cells = [];
      for (let i = 0; i < lead; i++) cells.push('<div class="cday out"></div>');
      for (let d = 1; d <= last.getDate(); d++) {
        const date = new Date(calMonth.getFullYear(), calMonth.getMonth(), d), key = localDate(date);
        const list = byDay[key] || [], today = key === localDate(now);
        cells.push(`<div class="cday${today ? ' today' : ''}"><div class="dnum">${d}</div>
          ${list.map(m => `<button class="cmeet" data-meet="${esc(m.id)}" title="${esc(m.type)}">${esc(fmtTime(m.startsAt))} ${esc(m.householdName || m.prospectName || m.type)}</button>`).join('')}
          <button class="cadd" data-add="${esc(key)}" aria-label="Add a meeting on ${esc(fmtDate(key))}">+</button></div>`);
      }
      return `<div class="panel-head"><h2>${esc(calMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }))}</h2>
        <span class="actions"><button class="btn" data-mv="-1">Previous</button><button class="btn" data-mv="1">Next</button></span></div>
        <div class="calgrid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cdow">${d}</div>`).join('')}${cells.join('')}</div>
        <p class="hint">Past meetings hold notes or a transcript. Select one to read it and draft follow-ups.</p>`;
    }, (el) => {
      el.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (+b.dataset.mv), 1); run(); });
      el.querySelectorAll('[data-meet]').forEach(b => b.onclick = () => openMeeting(b.dataset.meet, run));
      el.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addMeeting(b.dataset.add, run));
    });
  };
  run();
}

async function openMeeting(id, done) {
  const dlg = $('dlg');
  dlg.innerHTML = '<p class="empty">Loading…</p>'; dlg.showModal();
  try {
    const m = await api('GET', '/meetings/' + encodeURIComponent(id));
    let record = null;
    try { record = await api('GET', '/meetings/' + encodeURIComponent(id) + '/record'); } catch { /* most meetings have none */ }
    dlg.innerHTML = `<button class="btn quiet close" data-close>Close</button><h2 id="dlgTitle">${esc(m.type)}</h2>
      <div class="meta">${esc(m.householdName || m.prospectName || 'No client attached')} • ${esc(fmtDate(localDate(new Date(m.startsAt))))} at ${esc(fmtTime(m.startsAt))} • ${m.durationMinutes} minutes</div>
      <h3>Prep brief</h3><p class="draft">${esc(m.brief || 'No brief yet.')}</p>
      ${record ? `<h3>${record.kind === 'transcript' ? 'Transcript' : 'Notes'}</h3>
        ${record.consent ? `<p class="hint">Recording consent: ${record.consent.obtained ? 'on file' + (record.consent.method ? ', ' + esc(record.consent.method) : '') : '<strong>not on file</strong>'}.</p>` : ''}
        ${record.withheld ? `<p class="err">${esc(record.withheldReason)}</p>`
          : `<p class="draft">${esc(record.content)}</p><div class="actions"><button class="btn primary" id="mtNext">Suggest next steps</button></div><div id="mtOut"></div>`}`
        : '<p class="hint">No notes or transcript for this meeting.</p>'}
      <div class="actions"><button class="btn quiet" id="mtDel">Cancel meeting</button></div>`;
    const nx = $('mtNext');
    if (nx) nx.onclick = async () => {
      nx.disabled = true;
      try {
        const s = await api('POST', '/meetings/' + encodeURIComponent(id) + '/record/next-steps');
        $('mtOut').innerHTML = `<p class="hint">Drafts only. Nothing is created until you add one as a follow-up.</p>
          <ul class="rows">${s.items.map((it, i) => `<li><div class="grow"><div class="title">${esc(it.title)}</div><div class="meta">${it.dueDate ? 'Suggested due ' + esc(fmtDate(it.dueDate)) : 'No date'}</div></div>
          <button class="btn" data-accept="${i}">Add as follow-up</button></li>`).join('')}</ul>`;
        $('mtOut').querySelectorAll('[data-accept]').forEach(b => b.onclick = async () => {
          const it = s.items[+b.dataset.accept]; b.disabled = true;
          try { await api('POST', '/tasks', { body: { title: it.title, householdId: it.householdId || undefined, dueDate: it.dueDate || undefined, origin: 'meeting', originMeetingId: id } }); toast('Added to your follow-ups.'); b.textContent = 'Added'; advLoadStrip(); }
          catch (e) { toast(e.message); b.disabled = false; }
        });
      } catch (e) { toast(e.message); nx.disabled = false; }
    };
    $('mtDel').onclick = async () => {
      try { await api('DELETE', '/meetings/' + encodeURIComponent(id)); toast('Meeting cancelled.'); dlg.close(); done(); advLoadStrip(); }
      catch (e) { toast(e.message); }
    };
  } catch (e) { dlg.innerHTML = `<button class="btn quiet close" data-close>Close</button><p class="err">${esc(e.message)}</p>`; }
}

/* Book / households table: sorting and paging are done by the API. */
function bookPanel({ scope, canShare, id, title, size = 8 }) {
  const el = $(id), st = { sort: 'aum,desc', page: 0 };
  const cols = [{ key: 'name', label: 'Household' }, { key: 'aum', label: 'Assets', num: true }, { key: 'change30d', label: '30-day change', num: true }, { key: 'lastContactAt', label: 'Last contact' }, { key: 'status', label: 'Status' }];
  const run = () => load(el, title, () => api('GET', '/households', { query: { scope: scope === 'firm' ? 'firm' : undefined, sort: st.sort, page: st.page, size } }), (r) => {
    const pages = Math.max(1, Math.ceil(r.totalItems / r.size));
    return head(title, r.totalItems + ' households') + sortTable(cols, st.sort, r.items.map(h => `<tr><td><button class="link" data-hh="${esc(h.id)}">${esc(h.name)}</button></td><td class="num">${money(h.aum)}</td><td class="num ${pctClass(h.change30d)}">${pct(h.change30d)}</td><td>${esc(daysAgo(h.lastContactAt))}</td><td>${statusBadge(h.status)}</td></tr>`).join(''))
      + `<div class="pager"><span>Page ${r.page + 1} of ${pages}</span><button class="btn" data-pg="-1" ${r.page === 0 ? 'disabled' : ''}>Previous</button><button class="btn" data-pg="1" ${r.page + 1 >= pages ? 'disabled' : ''}>Next</button></div>`;
  }, (e) => {
    e.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { st.sort = nextSort(st.sort, b.dataset.sort, b.dataset.sort === 'name'); st.page = 0; run(); });
    e.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { st.page += +b.dataset.pg; run(); });
    e.querySelectorAll('[data-hh]').forEach(b => b.onclick = () => openHousehold(b.dataset.hh, canShare));
  });
  run();
}

  (el) => {
    el.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { st.sort = nextSort(st.sort, b.dataset.sort, b.dataset.sort === 'name'); runAdv(); });
    el.querySelectorAll('[data-adv]').forEach(b => b.onclick = async () => {

          <dl class="defs"><dt>Households</dt><dd>${a.households}</dd><dt>Assets</dt><dd>${moneyFull(a.aum)}</dd><dt>30-day change</dt><dd class="${pctClass(a.change30d)}">${pct(a.change30d)}</dd><dt>Meetings this week</dt><dd>${a.meetingsThisWeek}</dd><dt>Overdue tasks</dt><dd>${a.tasksOverdue}</dd><dt>Open alerts</dt><dd>${a.openAlerts}</dd></dl>
          <p class="hint">Opening this advisor's full dashboard in read-only mode is a decision still open in the requirements doc.</p>`;
      } catch (e) { dlg.innerHTML = `<button class="btn quiet close" data-close>Close</button><p class="err">${esc(e.message)}</p>`; }

  });

  let cstatus = '';
  const runComp = () => load($('f-compliance'), 'Compliance', () => api('GET', '/firm/compliance', { query: { status: cstatus, size: 6 } }), (r) =>
    `<div class="panel-head"><h2>Compliance</h2><label class="hint">Show <select id="cfilter" aria-label="Filter compliance by status"><option value="">All</option><option value="overdue">Overdue</option><option value="open">Open</option><option value="done">Done</option></select></label></div>` +
    (r.items.length ? `<ul class="rows">${r.items.map(c => `<li><div class="grow"><div class="title">${esc(c.title)}</div><div class="meta">${esc(CATEGORY[c.category])} \u2022 ${esc(c.advisorName)} \u2022 due ${esc(fmtDate(c.dueDate))}</div></div><span class="badge ${c.status === 'overdue' ? 'crit' : c.status === 'done' ? 'ok' : 'plain'}">${esc(c.status)}</span></li>`).join('')}</ul>` : '<p class="empty">No items match.</p>'),
  (el) => { const f = el.querySelector('#cfilter'); f.value = cstatus; f.onchange = () => { cstatus = f.value; runComp(); }; });
  runComp();

  load($('f-alerts'), 'Firm alerts', () => api('GET', '/alerts', { query: { scope: 'firm' } }), (r) => head('Firm alerts', r.items.length + ' open') + alertsList(r.items.slice(0, 6)));

  bookPanel({ scope: 'firm', canShare: false, id: 'f-book', title: 'Households across the firm', size: 6 });
}

    } catch (e) { dlg.innerHTML = `<button class="btn quiet close" data-close>Close</button><p class="err">${esc(e.message)}</p>`; }
  }));

  // The principal is also an advisor here, so /billing/fees resolves to their own book.

    head('Client fees', 'Next run ' + fmtDate(r.nextRunDate)) + `
    <h3>Schedule</h3>
    <div class="tablewrap"><table><thead><tr><th>Assets</th><th class="num">Annual rate</th></tr></thead><tbody>
    ${r.schedule.map(t => `<tr><td>${money(t.minAssets)}${t.maxAssets ? ' to ' + money(t.maxAssets) : ' and above'}</td><td class="num">${t.annualRatePct}%</td></tr>`).join('')}

    <h3>This quarter</h3>

/* Branding is the one thing every role reads, so it is applied in the shell, not per view.
   The stored accent is a light-mode colour. Used as-is in dark mode it fails contrast against
   the dark ground, so it is lifted toward the page ink first. */
const isDark = () => document.documentElement.dataset.theme === 'dark'
  || (document.documentElement.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

function forTheme(hex) {
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
  if (!m || !isDark()) return hex;
  const mix = (c, t) => Math.round(parseInt(c, 16) + (t - parseInt(c, 16)) * 0.55);
  return '#' + [mix(m[1], 230), mix(m[2], 238), mix(m[3], 236)].map(v => v.toString(16).padStart(2, '0')).join('');
}

function applyBranding(b) {
  if (!b) return;
  if (b.accentColor) document.documentElement.style.setProperty('--brand', forTheme(b.accentColor));
  if (b.firmName && SESSION) { SESSION.firm.name = b.firmName; $('subhead').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + ' • ' + b.firmName; }
}

  $('view').innerHTML = `<dl class="strip three" id="strip"></dl>
    <div class="grid">
      <div class="col">${panel('c-accounts')}${panel('c-shared')}${panel('c-docs')}</div>

    $('strip').innerHTML = `

  (el) => el.querySelectorAll('[data-doc]').forEach(b => b.onclick = async () => { try { const r = await api('GET', '/me/documents/' + encodeURIComponent(b.dataset.doc)); toast(r.mockDownload ? 'A download of ' + r.filename + ' would start here.' : 'Download started.'); } catch (e) { toast(e.message); } }));

  load($('c-request'), 'Request a meeting', async () => null, () => head('Request a meeting') + `

    <div class="field"><label for="mrTime">A time that suits you (optional)</label><input type="datetime-local" id="mrTime"></div>
    <div class="field"><label for="mrNote">Anything else we should know (optional)</label><textarea id="mrNote"></textarea></div>
    <button class="btn primary" id="mrGo">Send request</button>`,
  () => { $('mrGo').onclick = async () => {
    const topic = $('mrTopic').value.trim(); if (!topic) { toast('Tell us what you would like to discuss.'); return; }
    const t = $('mrTime').value;
    try { await api('POST', '/me/meeting-requests', { body: { topic, note: $('mrNote').value.trim() || undefined, preferredTimes: t ? [new Date(t).toISOString()] : undefined } }); toast('Request sent. Your advisor will be in touch.'); $('mrTopic').value = ''; $('mrNote').value = ''; $('mrTime').value = ''; }
    catch (e) { toast(e.message); }
  }; });

  load($('c-fees'), 'Fees', () => api('GET', '/me/fees'), (r) => head('Fees') + `<ul class="rows">${r.items.map(f => `<li><div class="grow"><div class="title">${esc(f.description)}</div><div class="meta">${esc(fmtDate(f.periodStart))} to ${esc(fmtDate(f.periodEnd))} \u2022 ${esc(f.maskedAccountNumber)}</div></div><div style="text-align:right"><div class="title">${moneyFull(f.amount)}</div><span class="badge ${f.status === 'paid' ? 'ok' : f.status === 'billed' ? 'warn' : 'plain'}">${esc(f.status)}</span></div></li>`).join('')}</ul>`);

    <button class="btn primary" id="pfSave">Save preferences</button>`,
  () => { $('pfSave').onclick = async () => { try { await api('PATCH', '/me/preferences', { body: { paperless: $('pfPaper').checked, notificationChannels: [...document.querySelectorAll('[data-ch]:checked')].map(x => x.dataset.ch) } }); toast('Preferences saved.'); } catch (e) { toast(e.message); } }; });
}

/* =====================================================================
   9. APP SHELL
   ===================================================================== */
let SESSION, VIEW;
const VIEWS = { firm: firmView, advisor: advisorView, client: clientView };
const VIEW_LABEL = { firm: 'Firm', advisor: 'Advisor', client: 'Client' };

function showView(v) {
  VIEW = v;
  const first = SESSION.name.split(' ')[0], h = new Date().getHours();
  $('greeting').textContent = v === 'firm' ? 'Firm overview' : v === 'client' ? 'Welcome, ' + first : (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', ' + first;
  $('subhead').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + ' \u2022 ' + SESSION.firm.name;
  const tabs = $('tabs');
  tabs.hidden = SESSION.views.length < 2;
  tabs.innerHTML = SESSION.views.map(x => `<button role="tab" data-view="${x}" aria-selected="${x === v}">${VIEW_LABEL[x]}</button>`).join('');
  VIEWS[v]();
}

async function boot() {
  $('demo').hidden = !(CONFIG.mode === 'mock' || CONFIG.personaPicker);
  $('demoText').textContent = CONFIG.mode === 'mock' ? 'Sample data. This page runs a mock of the draft API v0.3, and nothing leaves your browser.' : 'Connected to the standalone mock server. Data resets when the server restarts.';
  $('foot').textContent = CONFIG.mode === 'mock' ? 'Showing sample data from a mock of the draft API v0.3. Set CONFIG.mode to live and CONFIG.baseUrl to connect the real backend.'
    : CONFIG.personaPicker ? 'Talking to the standalone mock server through the /v1 API. Point CONFIG.baseUrl at the real backend to go live.' : '';
  $('view').innerHTML = '<div class="skel"></div><div class="skel m"></div>';
  try { SESSION = await api('GET', '/session'); }
  catch (e) { $('view').innerHTML = `<p class="err">${esc(e.message || "Couldn't sign you in.")}</p>`; return; }
  $('avatar').textContent = SESSION.name.split(' ').map(p => p[0]).slice(0, 2).join('');
  try { applyBranding(await api('GET', '/firm/branding')); } catch { /* branding is decoration; never block the app */ }
  showView(SESSION.views[0]);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view]'); if (t) showView(t.dataset.view);
  const p = e.target.closest('[data-persona]');
  if (p) { currentPersona = p.dataset.persona; document.querySelectorAll('[data-persona]').forEach(b => b.setAttribute('aria-pressed', String(b === p))); boot(); }
  if (e.target.closest('[data-close]')) $('dlg').close();
});
boot();
