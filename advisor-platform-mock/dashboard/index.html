<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advisor platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div class="wrap">
  <div class="demo" id="demo" hidden>
    <span id="demoText"></span>
    <span>Sign in as</span>
    <div class="tabs" id="personas" role="group" aria-label="Sign in as">
      <button data-persona="dana" aria-pressed="true">Dana, principal and advisor</button>
      <button data-persona="marcus" aria-pressed="false">Marcus, advisor</button>
      <button data-persona="grace" aria-pressed="false">Grace, client</button>
    </div>
  </div>

  <div id="navtop"></div>

  <header class="top">
    <div>
      <h1 id="greeting">&nbsp;</h1>
      <p id="subhead">&nbsp;</p>
    </div>
    <div class="who">
      <button class="btn" id="actBtn" aria-expanded="false" aria-controls="actPanel" hidden>Activity</button>
      <div class="tabs" id="tabs" role="tablist" aria-label="View" hidden></div>
      <div class="avatar" id="avatar" aria-hidden="true"></div>
    </div>
  </header>

  <div id="view"></div>
  <footer id="foot"></footer>
</div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<!-- Ask and Activity open beside the page, never over it (UX_IA §5, FO-06), and are in the
     same place on every screen (ST-01): Ask bottom right, Activity top right. -->
<button class="btn ask askfab" id="askBtn" aria-expanded="false" aria-controls="askPanel" hidden>Ask</button>
<aside class="side" id="askPanel" aria-labelledby="askTitle" hidden></aside>
<aside class="side" id="actPanel" aria-labelledby="actTitle" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
